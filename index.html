  async getSellerByHandle(h) { const uid = this._g("handles")[h]; return uid ? { uid, ...this._g("sellers")[uid] } : null; },
  async handleTaken(h) { return !!this._g("handles")[h]; },
  async createSeller(uid, data) {
    const hs = this._g("handles"); if (hs[data.handle]) throw new Error("handle-taken");
    hs[data.handle] = uid; this._s("handles", hs);
    const ss = this._g("sellers"); ss[uid] = data; this._s("sellers", ss);
  },
  async updateSeller(uid, patch) { const ss = this._g("sellers"); ss[uid] = { ...ss[uid], ...patch }; this._s("sellers", ss); },

  async saveProduct(id, data, photos) {

    if (photos) { const ph = this._g("photos"); ph[id] = photos; this._s("photos", ph); }

  async createSellerOrder(id, doc) { const os = this._g("sorders"); os[id] = doc; this._s("sorders", os); },

  async listCustomerOrders(uid) { return Object.entries(this._g("sorders")).filter(([, d]) => d.customerUid === uid).map(([id, d]) => ({ id, ...d })); },

};
/* ---- backend: Cloud Firestore ---- */
const FireMarket = {
  async db() { return FirebaseAuth._db(); },
  async listActive() { const db = await this.db(); const s = await db.collection("products").where("status", "==", "active").limit(300).get(); return s.docs.map(d => ({ id: d.id, ...d.data() })); },
  async getSeller(uid) { const db = await this.db(); const s = await db.collection("sellers").doc(uid).get(); return s.exists ? s.data() : null; },
  async getSellerByHandle(h) { const db = await this.db(); const r = await db.collection("storeHandles").doc(h).get(); if (!r.exists) return null; const uid = r.data().uid; const s = await db.collection("sellers").doc(uid).get(); return s.exists ? { uid, ...s.data() } : null; },
  async handleTaken(h) { const db = await this.db(); return (await db.collection("storeHandles").doc(h).get()).exists; },
  async createSeller(uid, data) {
    const db = await this.db(), hRef = db.collection("storeHandles").doc(data.handle), sRef = db.collection("sellers").doc(uid);
    await db.runTransaction(async tx => { const h = await tx.get(hRef); if (h.exists) throw new Error("handle-taken"); tx.set(hRef, { uid }); tx.set(sRef, plain(data)); });
  },
  async updateSeller(uid, patch) { const db = await this.db(); await db.collection("sellers").doc(uid).set(plain(patch), { merge: true }); },
  async listMine(uid) { const db = await this.db(); const s = await db.collection("products").where("sellerId", "==", uid).get(); return s.docs.map(d => ({ id: d.id, ...d.data() })); },
  async saveProduct(id, data, photos) {
    const db = await this.db();
    await db.collection("products").doc(id).set(plain(data), { merge: true });
    if (photos) await db.collection("productImages").doc(id).set({ sellerId: data.sellerId, images: photos });
  },
  async deleteProduct(id) { const db = await this.db(); await db.collection("productImages").doc(id).delete().catch(() => {}); await db.collection("products").doc(id).delete(); },
  async getPhotos(id) { const db = await this.db(); const s = await db.collection("productImages").doc(id).get(); return s.exists ? s.data().images : null; },
  async createSellerOrder(id, doc) { const db = await this.db(); await db.collection("sellerOrders").doc(id).set(plain(doc)); },
  async listSellerOrders(uid) { const db = await this.db(); const s = await db.collection("sellerOrders").where("sellerId", "==", uid).get(); return s.docs.map(d => ({ id: d.id, ...d.data() })); },
  async listCustomerOrders(uid) { const db = await this.db(); const s = await db.collection("sellerOrders").where("customerUid", "==", uid).get(); return s.docs.map(d => ({ id: d.id, ...d.data() })); },
  async updateSellerOrder(id, patch) { const db = await this.db(); await db.collection("sellerOrders").doc(id).update(plain(patch)); }
};

let marketResolve;
const Market = {
  loaded: false,
  ready: new Promise(r => { marketResolve = r; }),
  be() { return authMode === "firebase" ? FireMarket : LocalMarket; },
  online() { return authMode === "firebase"; },
  mount(docs) {
    const keep = {}; PRODUCTS.filter(p => p.market).forEach(p => { keep[p.id] = p.full; });
    for (let i = PRODUCTS.length - 1; i >= 0; i--) if (PRODUCTS[i].market) { delete byId[PRODUCTS[i].id]; PRODUCTS.splice(i, 1); }
    docs.forEach(d => { const p = normMarket(d.id, d); p.full = keep[p.id] || null; PRODUCTS.push(p); byId[p.id] = p; });
  },
  async refresh() {
    try { this.mount(await this.be().listActive()); } catch (e) { console.warn("[URBANSTYLE] Couldn't load marketplace products:", e.code || e.message || e); }
    this.loaded = true; marketResolve();
    updateCartCount(); if (openPanel && openPanel.id === "cart-drawer") renderMiniCart();
  },
  async init() {
    await authReady; await this.refresh();
    if (["shop", "product", "store", "cart", "checkout", "wishlist", "seller"].includes(route.v)) renderView();
  },
  async loadPhotos(p) { try { p.full = (await this.be().getPhotos(p.id)) || p.thumbs; } catch (e) { p.full = p.thumbs; } },
  _me: null, _meFor: null,
  async mySeller(force) {
    const uid = uidOf(); if (!uid) return null;
    if (!force && this._meFor === uid) return this._me;
    this._me = await this.be().getSeller(uid); this._meFor = uid; return this._me;
  },
  // split a customer order into one order per seller
  async createSellerOrders(order) {
    const groups = {};
    order.lines.forEach(l => { const p = byId[l.id]; if (p && p.market) (groups[p.sellerId] = groups[p.sellerId] || { p, lines: [] }).lines.push({ ...l, name: p.name, unit: lineUnit(l), thumb: (p.thumbs || [])[0] || "" }); });
    const u = Auth.current();
    for (const [sellerId, g] of Object.entries(groups)) {
      const subtotal = g.lines.reduce((s, l) => s + l.unit * l.qty, 0);
      const doc = { orderNumber: order.number, sellerId, sellerName: g.p.sellerName, customerUid: u ? u.id : null,
        customer: { name: order.customer.fullname, email: order.customer.email, phone: order.customer.phone, address: order.customer.address, city: order.customer.city, state: order.customer.state },
        lines: g.lines, subtotal, ship: order.ship, payment: order.payment || null, pay: order.pay, status: "new",
        history: [{ status: "new", at: new Date().toISOString() }], created: order.date, updatedAt: order.date };
      try { await this.be().createSellerOrder(`${order.number}-${sellerId.slice(0, 8)}`, doc); }
      catch (e) { console.warn("[URBANSTYLE] Couldn't send the order to seller", sellerId, e.code || e.message || e); }
    }
  }
};

function sellerOverview({ products, orders, panel }) {
  const now = Date.now(), live = orders.filter(o => o.status !== "cancelled");
  const in30 = live.filter(o => now - new Date(o.created) < 30 * 864e5);
  const rev30 = in30.reduce((s, o) => s + o.subtotal, 0), items30 = in30.reduce((s, o) => s + o.lines.reduce((n, l) => n + l.qty, 0), 0);
  const active = products.filter(p => p.status === "active").length;
  const low = products.filter(p => p.status === "active" && p.sizes.some(s => { const n = parseInt(p.stock[s], 10) || 0; return n <= CFG.marketplace.lowStockAt; }));
  // last 14 days of sales
  const days = Array.from({ length: 14 }, (_, i) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - 13 + i); return d; });
  const perDay = days.map(d => live.filter(o => { const t = new Date(o.created); return t >= d && t < new Date(d.getTime() + 864e5); }).reduce((s, o) => s + o.subtotal, 0));
  const max = Math.max(1, ...perDay), W = 560, H = 160, bw = W / 14;
  const chart = `<svg class="sales-chart" viewBox="0 0 ${W} ${H + 24}" role="img" aria-label="Sales for the last 14 days, highest day ${money(max)}">
    <line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="currentColor" stroke-opacity=".2"/>
    ${perDay.map((val, i) => { const h = val ? Math.max(3, val / max * (H - 16)) : 0; return `<rect x="${i * bw + 5}" y="${H - h}" width="${bw - 10}" height="${h}" rx="4" fill="${i === 13 ? "#C6F135" : "#141414"}"><title>${fmtD(days[i])}: ${money(val)}</title></rect>`; }).join("")}
    ${[0, 6, 13].map(i => `<text x="${i * bw + bw / 2}" y="${H + 18}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".6">${i === 13 ? "Today" : fmtD(days[i])}</text>`).join("")}</svg>`;
  panel.innerHTML = `
    <div class="kpis">
      <div class="kpi"><span>Sales · 30 days</span><b>${money(rev30)}</b></div>
      <div class="kpi"><span>Orders · 30 days</span><b>${in30.length}</b></div>
      <div class="kpi"><span>Items sold · 30 days</span><b>${items30}</b></div>
      <div class="kpi"><span>Live products</span><b>${active}<small>/${products.length}</small></b></div></div>
    <div class="acct-cols">
      <section class="acct-box"><div class="box-head"><h2>Sales, last 14 days</h2><span class="muted small">Excludes cancelled orders</span></div>${chart}</section>
      <section class="acct-box"><h2>Needs your attention</h2><ul class="todo">
        <li>${I.truck}<span><b>${orders.filter(o => o.status === "new").length}</b> new order(s) to confirm</span><a class="inline-link" href="#seller-orders">View</a></li>
        <li>${I.box}<span><b>${orders.filter(o => o.status === "processing").length}</b> order(s) to ship</span><a class="inline-link" href="#seller-orders">View</a></li>
        <li>${I.star}<span><b>${low.length}</b> product(s) low on stock</span><a class="inline-link" href="#seller-products">View</a></li>
        <li>${I.pen}<span><b>${products.filter(p => p.status === "draft").length}</b> draft(s) not published</span><a class="inline-link" href="#seller-products">View</a></li></ul></section></div>
    <section class="acct-box"><div class="box-head"><h2>Recent orders</h2><a class="inline-link" href="#seller-orders">All orders</a></div>
      ${orders.length ? `<div class="table-wrap"><table class="dash-table"><thead><tr><th>Order</th><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody>
        ${orders.slice(0, 6).map(o => `<tr><td><a class="inline-link" href="#seller-orders" data-open="${o.id}">${esc(o.orderNumber)}</a></td><td>${fmtD(o.created)}</td><td>${esc(o.customer.name)}</td><td>${o.lines.reduce((n, l) => n + l.qty, 0)}</td><td>${money(o.subtotal)}</td><td>${statusPill(o.status)}</td></tr>`).join("")}</tbody></table></div>`
        : `<p class="muted">No orders yet. Share your store page to get your first sale.</p>`}</section>
    ${products.length ? "" : `<section class="acct-box acct-perk"><h2>List your first product</h2><p>Add photos, a price, sizes and stock. It takes about 3 minutes.</p><a class="btn btn-ink" href="#seller-new">${I.plus} Add product</a></section>`}`;
  panel.addEventListener("click", e => { const a = e.target.closest("[data-open]"); if (a) sessionStorage.setItem("us_openOrder", a.dataset.open); });
}

function sellerProducts({ products, panel }) {
  let q = "", filter = "all";
  const draw = () => {
    const list = products.filter(p => (!q || p.name.toLowerCase().includes(q)) && (filter === "all" || (filter === "soldout" ? totalStock(p) === 0 : p.status === filter)));

        <td class="row-actions"><a class="btn btn-ghost btn-sm" href="#seller-edit-${p.id}">Edit</a>${p.status === "active" ? `<a class="btn btn-ghost btn-sm" href="#product-${p.id}">View</a>` : ""}<button type="button" class="btn btn-ghost btn-sm danger" data-del="${p.id}">Delete</button></td></tr>`; }).join("")}</tbody></table></div>`
      : `<div class="empty"><h2>${products.length ? "No products match." : "No products yet."}</h2><p>${products.length ? "Try a different search or filter." : "Add your first product to start selling."}</p><a class="btn btn-ink" href="#seller-new">${I.plus} Add product</a></div>`;
  };
  panel.innerHTML = `<section class="acct-box"><div class="box-head"><h2>Products</h2><a class="btn btn-lime btn-sm" href="#seller-new">${I.plus} Add product</a></div>
    <div class="dash-tools"><label class="sr-only" for="prod-q">Search products</label><input id="prod-q" type="search" placeholder="Search your products">
      <div class="tabs" role="group" aria-label="Filter">${[["all", "All"], ["active", "Live"], ["draft", "Drafts"], ["soldout", "Sold out"]].map(([k, n]) => `<button type="button" role="tab" data-f="${k}" aria-selected="${k === "all"}">${n}</button>`).join("")}</div></div>
    <div id="prod-list"></div></section>`;
  $("#prod-q").addEventListener("input", e => { q = e.target.value.trim().toLowerCase(); draw(); });
  panel.querySelector(".tabs").addEventListener("click", e => { const b = e.target.closest("[data-f]"); if (!b) return; filter = b.dataset.f; $$(".tabs [data-f]", panel).forEach(x => x.setAttribute("aria-selected", x === b)); draw(); });
  panel.addEventListener("click", async e => {
    const d = e.target.closest("[data-del]"); if (!d) return;

    d.disabled = true; d.textContent = "Deleting…";

function sellerOrders({ orders, products, panel }) {
  let filter = "all";
  const open = sessionStorage.getItem("us_openOrder"); sessionStorage.removeItem("us_openOrder");
  const counts = k => k === "all" ? orders.length : orders.filter(o => o.status === k).length;
  const NEXT = { new: [["processing", "Confirm & process"], ["cancelled", "Cancel order"]], processing: [["shipped", "Mark as shipped"], ["cancelled", "Cancel order"]], shipped: [["delivered", "Mark as delivered"]] };
  const priceNow = l => { const p = byId[l.id] || products.find(x => x.id === l.id); return p ? unitPrice(p) : null; };
  const draw = () => {
    const list = orders.filter(o => filter === "all" || o.status === filter);
    $("#ord-list").innerHTML = list.length ? list.map(o => { const wa = String(o.customer.phone || "").replace(/\D/g, "").replace(/^0/, "234"); return `<details class="order-card seller-order"${o.id === open ? " open" : ""} data-id="${o.id}"><summary>
      <span class="oc-thumbs">${o.lines.slice(0, 3).map(l => `<img src="${l.thumb || PHOTO_PLACEHOLDER}" alt="" width="44" height="55">`).join("")}</span>
      <span class="oc-main"><b>${esc(o.orderNumber)}</b><small>${fmtDT(o.created)} · ${esc(o.customer.name)}</small></span>
      <span class="oc-side"><b>${money(o.subtotal)}</b>${statusPill(o.status)}</span></summary>
      <div class="so-body">
        <div class="so-cols"><div><h4>Items</h4><ul class="mini-lines">${o.lines.map(l => { const now = priceNow(l); return `<li><span class="ml-img"><img src="${l.thumb || PHOTO_PLACEHOLDER}" alt="" width="56" height="70"><span class="ml-q">${l.qty}</span></span><span><b>${esc(l.name)}</b><small>${esc(l.color)}${l.size !== "One Size" ? " · " + esc(l.size) : ""} · ${money(l.unit)} each</small>${now !== null && now !== l.unit ? `<small class="warn-txt">Your current price is ${money(now)}. Check this order.</small>` : ""}</span><b>${money(l.unit * l.qty)}</b></li>`; }).join("")}</ul></div>
          <div><h4>Deliver to</h4><p><b>${esc(o.customer.name)}</b><br>${esc(o.customer.address)}<br>${esc(o.customer.city)}, ${esc(o.customer.state)}</p>
            <p class="so-contact"><a class="inline-link" href="tel:${esc(o.customer.phone)}">${esc(o.customer.phone)}</a>${wa ? ` · <a class="inline-link" href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp</a>` : ""}<br><span class="muted">${esc(o.customer.email)}</span></p>
            <h4>Payment</h4><p>${esc(o.pay || "Pay on delivery")}${o.payment && o.payment.reference ? `<br><small class="muted">Ref ${esc(o.payment.reference)}</small>` : ""}</p>
            <h4>Delivery method</h4><p>${esc({ standard: "Standard delivery", express: "Express delivery", pickup: "Studio pickup" }[o.ship] || o.ship)}</p></div></div>
        <ol class="so-history">${(o.history || []).map(h => `<li>${statusPill(h.status)}<span>${fmtDT(h.at)}${h.note ? ` · ${esc(h.note)}` : ""}</span></li>`).join("")}</ol>
        ${NEXT[o.status] ? `<div class="so-actions">${o.status === "processing" ? `<label class="sr-only" for="note-${o.id}">Tracking or rider details</label><input id="note-${o.id}" class="so-note" placeholder="Tracking number or rider details (optional)">` : ""}
          ${NEXT[o.status].map(([s, label]) => `<button type="button" class="btn ${s === "cancelled" ? "btn-ghost danger" : "btn-ink"} btn-sm" data-set="${s}">${label}</button>`).join("")}</div>` : ""}
      </div></details>`; }).join("") : `<div class="empty"><h2>No ${filter === "all" ? "" : ORDER_STATUS[filter].toLowerCase() + " "}orders.</h2><p>${orders.length ? "Try another filter." : "When customers buy your products, their orders appear here."}</p></div>`;
  };
  panel.innerHTML = `<section class="acct-box"><div class="box-head"><h2>Orders</h2><span class="muted small">${orders.length} total</span></div>
    <div class="tabs" role="group" aria-label="Filter orders">${["all", "new", "processing", "shipped", "delivered", "cancelled"].map(k => `<button type="button" role="tab" data-f="${k}" aria-selected="${k === "all"}">${k === "all" ? "All" : ORDER_STATUS[k]} <small>${counts(k)}</small></button>`).join("")}</div>
    <div id="ord-list" class="ord-list"></div></section>`;
  panel.querySelector(".tabs").addEventListener("click", e => { const b = e.target.closest("[data-f]"); if (!b) return; filter = b.dataset.f; $$(".tabs [data-f]", panel).forEach(x => x.setAttribute("aria-selected", x === b)); draw(); });
  panel.addEventListener("click", async e => {
    const b = e.target.closest("[data-set]"); if (!b) return;
    const card = b.closest("[data-id]"), o = orders.find(x => x.id === card.dataset.id), next = b.dataset.set;
    if (next === "cancelled" && b.dataset.confirm !== "1") { b.dataset.confirm = "1"; b.textContent = "Tap again to cancel"; return; }
    const note = (card.querySelector(".so-note") || {}).value || "";
    $$("[data-set]", card).forEach(x => { x.disabled = true; }); b.textContent = "Updating…";
    try {
      // stock: taken off when the seller confirms, put back if a confirmed order is cancelled
      if ((next === "processing" && !o.stockApplied) || (next === "cancelled" && o.stockApplied)) {
        const sign = next === "processing" ? -1 : 1, byProd = {};
        o.lines.forEach(l => { (byProd[l.id] = byProd[l.id] || []).push(l); });
        for (const [pid, ls] of Object.entries(byProd)) {
          const prod = products.find(x => x.id === pid); if (!prod) continue;
          const stock = { ...prod.stock }; ls.forEach(l => { stock[l.size] = Math.max(0, (parseInt(stock[l.size], 10) || 0) + sign * l.qty); });
          const sold = Math.max(0, (prod.sold || 0) - sign * ls.reduce((n, l) => n + l.qty, 0));
          await Market.be().saveProduct(pid, { stock, sold, updated: new Date().toISOString() }); prod.stock = stock; prod.sold = sold;
        }
      }
      const at = new Date().toISOString();
      const patch = { status: next, updatedAt: at, history: [...(o.history || []), { status: next, at, ...(note ? { note } : {}) }], stockApplied: next === "processing" ? true : next === "cancelled" ? false : !!o.stockApplied };
      if (note) patch.tracking = note;
      await Market.be().updateSellerOrder(o.id, patch); Object.assign(o, patch);
      await Market.refresh();
      say(`Order ${esc(o.orderNumber)} marked ${ORDER_STATUS[next].toLowerCase()}.`);
      panel.querySelectorAll(".tabs small").forEach((s, i) => { s.textContent = counts(["all", "new", "processing", "shipped", "delivered", "cancelled"][i]); });
      draw(); const reopened = $(`#ord-list [data-id="${o.id}"]`); if (reopened) reopened.open = true;
    } catch (err) { console.warn(err); say("Couldn't update the order. Try again."); draw(); }
  });
  draw();
}

/* ============ LIVE CHAT ============
   Customers chat from a bubble on every page; the team replies from the Support inbox (#support).
   Conversations live in Firestore (chats/{id} + chats/{id}/messages) and update in real time.
   Each conversation id is a long random secret kept in the customer's browser, so guests can chat
   without an account and nobody else can read their conversation. Only admin emails (below, and in
   firestore.rules) can list conversations and reply. */
CFG.support = {
  adminEmails: ["urbanstylefashionng@gmail.com"],   // who can open the Support inbox
  days: [1, 2, 3, 4, 5, 6], open: 9, close: 18,       // Mon–Sat, 9am–6pm Lagos time
  whatsapp: "2348168013667"
};
function isOpenNow() {
  const now = new Date(), wat = new Date(now.getTime() + (now.getTimezoneOffset() + 60) * 60000); // Lagos is UTC+1
  return CFG.support.days.includes(wat.getDay()) && wat.getHours() >= CFG.support.open && wat.getHours() < CFG.support.close;
}
function isAdminUser() {
  const u = Auth.current();
  return !!u && CFG.support.adminEmails.map(normEmail).includes(normEmail(u.email)) && (authMode !== "firebase" || u.verified);
}
const chatId = () => { const b = crypto.getRandomValues(new Uint8Array(18)); return "c" + [...b].map(x => x.toString(36).padStart(2, "0")).join("").slice(0, 30); };
const fmtTime = iso => new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
const linkify = s => esc(s).replace(/(#[a-z0-9-]+)/gi, m => /^#(account|help|shop|product|contact|cart|wishlist|store)/.test(m) ? `<a href="${m}">${m === "#account-orders" ? "My account → Orders" : m === "#help-sizes" ? "Size guide" : m === "#help-returns" ? "Returns" : m === "#help-shipping" ? "Delivery info" : m}</a>` : m).replace(/\n/g, "<br>");

const LocalChat = {
  _c() { return store.get("chats", {}); }, _m() { return store.get("chatmsgs", {}); },
  async create(id, doc) { const c = this._c(); c[id] = doc; store.set("chats", c); },
  async exists(id) { return !!this._c()[id]; },
  async update(id, patch, incAdmin) { const c = this._c(); if (!c[id]) return; if (incAdmin) patch.unreadForAdmin = (c[id].unreadForAdmin || 0) + 1; c[id] = { ...c[id], ...patch }; store.set("chats", c); },
  async add(id, m) { const all = this._m(); (all[id] = all[id] || []).push({ id: newId(), ...m }); store.set("chatmsgs", all); },
  _watch(read, fn) {
    let last = ""; const tick = () => { const v = read(); const k = JSON.stringify(v).length + ":" + (v.length ? JSON.stringify(v[v.length - 1]) : ""); if (k !== last) { last = k; fn(v); } };
    tick(); const t = setInterval(tick, 1200); const onS = e => { if (e.key && e.key.startsWith("us_chat")) tick(); };
    addEventListener("storage", onS); return () => { clearInterval(t); removeEventListener("storage", onS); };
  },
  watchMessages(id, fn) { return this._watch(() => this._m()[id] || [], fn); },
  watchChats(fn) { return this._watch(() => Object.entries(this._c()).map(([id, d]) => ({ id, ...d })).sort((a, b) => b.updatedAt.localeCompare(a.updatedAt)), fn); }
};
const FireChat = {
  db() { return FirebaseAuth._db(); },
  async create(id, doc) { const db = await this.db(); await db.collection("chats").doc(id).set(plain(doc)); },
  async exists(id) { const db = await this.db(); return (await db.collection("chats").doc(id).get()).exists; },
  async update(id, patch, incAdmin) { const db = await this.db(); const p = plain(patch); if (incAdmin) p.unreadForAdmin = firebase.firestore.FieldValue.increment(1); await db.collection("chats").doc(id).set(p, { merge: true }); },
  async add(id, m) { const db = await this.db(); await db.collection("chats").doc(id).collection("messages").add(plain(m)); },
  _live(make, fn, onErr) {
    let unsub = () => {}, dead = false;
    this.db().then(db => { if (!dead) unsub = make(db).onSnapshot(s => fn(s.docs.map(d => ({ id: d.id, ...d.data() }))), e => { console.warn("[URBANSTYLE] Chat connection:", e.code || e); if (onErr) onErr(e); }); })
      .catch(e => { console.warn("[URBANSTYLE] Chat unavailable:", e.message); if (onErr) onErr(e); });
    return () => { dead = true; unsub(); };
  },
  watchMessages(id, fn, onErr) { return this._live(db => db.collection("chats").doc(id).collection("messages").orderBy("at"), fn, onErr); },
  watchChats(fn, onErr) { return this._live(db => db.collection("chats").orderBy("updatedAt", "desc").limit(100), fn, onErr); }
};
const chatBe = () => authMode === "firebase" ? FireChat : LocalChat;

// Instant answers for the most common questions (the team can always follow up)

const Chat = {

      const saved = store.get("chatId", null);

    });
  }
};

/* Team-only pages: explain what's missing and let the team fix it right here

function teamGate(v, u, what) {

  v.innerHTML = `<div class="wrap auth-page"><section class="auth-card action-card">

    <p class="auth-sub">${isTeamEmail
      ? `To open ${what}, the store account (<b>${esc(u.email)}</b>) needs a verified email. Tap <b>Send verification email</b>, open the email (check Spam too), tap the button in it, then come back and tap <b>I've verified, continue</b>.`
      : `You're signed in as <b>${esc(u.email)}</b>. Sign out and sign in with the store account to open ${what}.`}</p>
    <div class="btn-pair">${isTeamEmail
      ? `<button type="button" class="btn btn-lime" id="tg-send">Send verification email</button><button type="button" class="btn btn-ink" id="tg-check">I've verified, continue</button>`
      : `<button type="button" class="btn btn-ink" id="tg-out">Sign out</button><a class="btn btn-ghost" href="#home">Back to the shop</a>`}</div>
    <p class="muted small" id="tg-msg" role="status"></p></section></div>`;
  const msg = t => { $("#tg-msg").innerHTML = t; };
  const send = $("#tg-send"), check = $("#tg-check"), out = $("#tg-out");
  if (send) send.addEventListener("click", async () => {
    send.disabled = true; send.textContent = "Sending…";
    try { await Auth.resendVerification(); send.textContent = "Email sent"; msg("Check the inbox (and Spam) for <b>Confirm your email</b>. The link works once."); }
    catch (e) { send.disabled = false; send.textContent = "Send verification email"; msg("Couldn't send just now. Wait a minute and try again."); }
  });
  if (check) check.addEventListener("click", async () => {
    check.disabled = true; check.textContent = "Checking…";
    const ok = await refreshTeamAccess();
    if (ok) { refreshAccountUI(); renderView(); return; }
    check.disabled = false; check.textContent = "I've verified, continue";
    msg("Not verified yet. Open the newest verification email and tap its button first, then try again.");
  });
  if (out) out.addEventListener("click", async () => { await Auth.signOut(); authNext = route.v === "admin" ? "admin" : "support"; go("login"); });
}
// Re-reads the signed-in account from Firebase and gets a fresh sign-in token, so a newly verified
// email counts straight away (no need to sign out and back in). Returns true when team access is ready.
async function refreshTeamAccess() {
  if (authMode !== "firebase" || !fb.auth.currentUser) return isAdminUser();
  try {
    const fu = fb.auth.currentUser; await fu.reload(); await fu.getIdToken(true);
    const me = Auth.current(); if (me) me.verified = !!fu.emailVerified;
  } catch (e) { console.warn("[URBANSTYLE] Couldn't refresh the account:", e.code || e); }
  return isAdminUser();
}

  let lastUnread = null, firstLoad = true;

  const chime = () => { try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.setValueAtTime(.001, a.currentTime); g.gain.exponentialRampToValueAtTime(.2, a.currentTime + .02); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .5); o.start(); o.stop(a.currentTime + .5); } catch (e) {} };

  notifyBtn.addEventListener("click", async () => { try { await Notification.requestPermission(); } catch (e) {} drawNotifyBtn(); });
  drawNotifyBtn(); $(".support-page .page-head").append(notifyBtn);
  // if Firebase refuses the list (usually a sign-in token from before the email was verified),

  let retried = false;
  const onListError = async e => {
    if (!retried && e && e.code === "permission-denied") { retried = true; if (await refreshTeamAccess()) { renderView(); return; } }
    const box = $("#sup-list"); if (!box) return;
    box.innerHTML = `<li class="sup-empty sup-error"><b>Couldn't load conversations.</b><span>${e && e.code === "permission-denied" ? "Your access needs refreshing." : "Check your internet connection."}</span><button type="button" class="btn btn-ink btn-sm" id="sup-refresh">Refresh access</button></li>`;

    lastUnread = unread; firstLoad = false;
  }, onListError);
  VIEWS._cleanup = () => { unsubChats(); if (unsubMsgs) unsubMsgs(); document.title = baseTitle; };
};

function trackToken() { const b = crypto.getRandomValues(new Uint8Array(16)); return "t" + [...b].map(x => x.toString(36).padStart(2, "0")).join("").slice(0, 24); }

const LocalDB = {
  _g(c) { return store.get("db_" + c.replace(/\//g, "_"), {}); }, _s(c, v) { store.set("db_" + c.replace(/\//g, "_"), v); },
  async add(c, doc) { const id = newId(); await this.set(c, id, doc); return id; },
  async set(c, id, doc, merge) {
    if (c.startsWith("customers/")) return localCustomerOrder(c.split("/")[1], id, doc); // local accounts keep orders on the user record
    const all = this._g(c); all[id] = merge ? { ...(all[id] || {}), ...doc } : doc; this._s(c, all);
  },
  async get(c, id) { const d = this._g(c)[id]; return d ? { id, ...d } : null; },
  async where(c, f, v) { return Object.entries(this._g(c)).filter(([, d]) => d[f] === v).map(([id, d]) => ({ id, ...d })); },
  async all(c) { return Object.entries(this._g(c)).map(([id, d]) => ({ id, ...d })); },
  async del(c, id) { const all = this._g(c); delete all[id]; this._s(c, all); }
};
function localCustomerOrder(uid, number, patch) {
  const users = store.get("users", {});
  for (const k of Object.keys(users)) if (users[k].id === uid) { users[k].orders = (users[k].orders || []).map(o => o.number === number ? { ...o, ...patch } : o); }
  store.set("users", users);
}
const FireDB = {
  db() { return FirebaseAuth._db(); },
  async add(c, doc) { const db = await this.db(); return (await db.collection(c).add(plain(doc))).id; },
  async set(c, id, doc, merge) { const db = await this.db(); await db.collection(c).doc(id).set(plain(doc), merge ? { merge: true } : {}); },
  async get(c, id) { const db = await this.db(); const s = await db.collection(c).doc(id).get(); return s.exists ? { id: s.id, ...s.data() } : null; },
  async where(c, f, v) { const db = await this.db(); const s = await db.collection(c).where(f, "==", v).limit(500).get(); return s.docs.map(d => ({ id: d.id, ...d.data() })); },
  async all(c) { const db = await this.db(); const s = await db.collection(c).limit(500).get(); return s.docs.map(d => ({ id: d.id, ...d.data() })); },
  async del(c, id) { const db = await this.db(); await db.collection(c).doc(id).delete(); }
};
const DB = () => authMode === "firebase" ? FireDB : LocalDB;
const copyText = (txt, btn) => (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => { if (btn) { const o = btn.textContent; btn.textContent = "Copied"; setTimeout(() => { btn.textContent = o; }, 1500); } }).catch(() => say("Couldn't copy automatically. Select the text and copy it."));

  async setOrderStatus(o, status, note) {
    const at = new Date().toISOString(), history = [...(o.history || [{ status: "placed", at: o.date }]), { status, at, ...(note ? { note } : {}) }];

  }
};

/* ---------- consent + analytics (only runs when ids are set in CFG.analytics) ---------- */
const Analytics = {
  on: false,
  init() {
    const want = CFG.analytics.ga4 || CFG.analytics.metaPixel; if (!want) return;
    const choice = store.get("consent", null);
    if (choice === "yes") this.load(); else if (choice === null) this.banner();
  },
  banner() {
    const b = document.createElement("div"); b.className = "consent"; b.setAttribute("role", "region"); b.setAttribute("aria-label", "Cookie consent");
    b.innerHTML = `<p>We use cookies to understand how our store is used and to improve it. See our <a href="#privacy">Privacy policy</a>.</p><div class="btn-pair"><button type="button" class="btn btn-ghost btn-sm" data-c="no">Decline</button><button type="button" class="btn btn-lime btn-sm" data-c="yes">Accept</button></div>`;
    document.body.append(b);
    b.addEventListener("click", e => { const c = e.target.closest("[data-c]"); if (!c) return; store.set("consent", c.dataset.c); b.remove(); if (c.dataset.c === "yes") this.load(); });
  },
  load() {
    if (this.on) return; this.on = true;
    if (CFG.analytics.ga4) {
      loadScript("https://www.googletagmanager.com/gtag/js?id=" + CFG.analytics.ga4).catch(() => {});
      window.dataLayer = window.dataLayer || []; window.gtag = function () { dataLayer.push(arguments); };
      gtag("js", new Date()); gtag("config", CFG.analytics.ga4, { send_page_view: false });
    }
    if (CFG.analytics.metaPixel) {
      !function (f, b, e, v, n, t, s) { if (f.fbq) return; n = f.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments); }; if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = "2.0"; n.queue = []; t = b.createElement(e); t.async = !0; t.src = v; s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s); }(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
      fbq("init", CFG.analytics.metaPixel);
    }
    this.page();
  },
  page() { if (!this.on) return; if (window.gtag) gtag("event", "page_view", { page_title: document.title, page_location: location.href }); if (window.fbq) fbq("track", "PageView"); },
  event(name, data) { if (!this.on) return; if (window.gtag) gtag("event", name, data); if (window.fbq) fbq("track", { add_to_cart: "AddToCart", purchase: "Purchase" }[name] || name, data); }
};

/* ---------- installable app (PWA) ---------- */
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $$(".install-btn").forEach(b => { b.hidden = false; }); });
document.addEventListener("click", async e => {
  if (!e.target.closest(".install-btn") || !installEvt) return;
  installEvt.prompt(); const r = await installEvt.userChoice.catch(() => null); installEvt = null;
  $$(".install-btn").forEach(b => { b.hidden = true; }); if (r && r.outcome === "accepted") say("URBANSTYLE is installed on your home screen.");
});

  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

  const out = {};
  PRODUCTS.filter(p => !p.photos && !p.market).forEach(p => p.colors.forEach((c, ci) => viewsFor(p).forEach(w => {
    out[`products/${p.id}-${p.name.toLowerCase().replace(/[^a-z0-9]+/g, "-")}-${c.name.toLowerCase().replace(/\s+/g, "-")}-${w}.svg`] = productSVG(p, ci, w);
  })));
  const dec = u => decodeURIComponent(u.slice(u.indexOf(",") + 1));
  out["lifestyle/home-hero-rail.svg"] = dec(rackScene([["p13", 1], ["p01", 1], ["p02", 1], ["p09", 1], ["p04", 0], ["p15", 0]]));
  out["lifestyle/about-hero-rail.svg"] = dec(rackScene([["p16", 0], ["p06", 0], ["p14", 0], ["p10", 1], ["p15", 1], ["p04", 1]], false));
  out["lifestyle/process-sketch.svg"] = dec(sketchScene());
  out["lifestyle/process-cutting.svg"] = dec(cutScene());
  out["brand/logo-mark.svg"] = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><rect width="48" height="48" rx="13" fill="#141414"/><path d="M15 12v14a9 9 0 0 0 18 0V12" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/><circle cx="37" cy="37" r="6" fill="#C6F135"/></svg>`;
  return out;
};

/* boot */
renderShell();
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return;
  const h = a.getAttribute("href"); if (h.length < 2) return;
  if (a.dataset.next) authNext = a.dataset.next;
  if (a.dataset.email) authPrefill = { email: a.dataset.email, name: a.dataset.name || "" };
  e.preventDefault(); go(h);
});
window.addEventListener("popstate", e => go((e.state && e.state.h) || location.hash || "home", { fromHistory: true }));
window.addEventListener("hashchange", () => go(location.hash || "home", { fromHistory: true }));
currentHash = AUTH_ACTION ? "auth-action" : location.hash.replace(/^#/, "") || "home";
route = parseRoute(currentHash);
renderView();
// once accounts are ready (Firebase connected, or fallback chosen), refresh anything that depends on who's signed in
authReady.then(() => { refreshAccountUI(); if (["account", "login", "signup", "checkout", "order", "product", "sell", "seller"].includes(route.v)) renderView(); });
Market.init(); // loads seller products into the shop
Reviews.init(); // loads published reviews for star ratings
Analytics.init(); // does nothing until analytics ids are added in CFG.analytics
})();
</script>
