<style>
/* =========================================================
   URBANSTYLE FASHION — storefront styles (mobile-first)
   Breakpoints: 480 / 768 / 1024
   ========================================================= */
:root{
  --ink:#141414; --bg:#F4F1EA; --lime:#C6F135; --gray:#8A8A85;
  --muted:#5F5F5A; --surface:#FBFAF6; --stone:#E7E2D7; --line:#DAD5CA; --ink-2:#2A2A28;
  --lime-deep:#A9D11C; --danger:#B3261E; --ok:#2F6B2F;
  --font-display:"Bricolage Grotesque","Arial Black","Helvetica Neue",Arial,sans-serif;
  --font-body:"DM Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --r-sm:10px; --r-md:16px; --r-lg:24px; --r-pill:999px;
  --gutter:16px; --maxw:1320px; --header-h:64px;
  --shadow-lg:0 2px 4px rgba(20,20,20,.06),0 18px 40px -14px rgba(20,20,20,.32);
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
@media (min-width:768px){:root{--gutter:28px}}
@media (min-width:1024px){:root{--gutter:40px;--header-h:76px}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--header-h) + 12px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.no-scroll{overflow:hidden}
img{max-width:100%;height:auto;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--font-display);line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance}
p{margin:0}
[hidden]{display:none!important}
.sr-only{position:absolute!important;left:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 6px var(--lime);border-radius:6px}
.wrap{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gutter)}
.skip-link{position:absolute;left:12px;top:-60px;z-index:100;background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r-pill);border:0}
.skip-link:focus{top:12px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:700 12px/1 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.eyebrow::before{content:"";width:18px;height:3px;border-radius:2px;background:var(--ink)}
.eyebrow.on-dark{color:#D5D5CE}.eyebrow.on-dark::before{background:var(--lime)}
#view{min-height:60vh;animation:viewIn .35s var(--ease)}
@keyframes viewIn{from{opacity:.4;transform:translateY(6px)}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 26px;border-radius:var(--r-pill);border:2px solid transparent;font:700 15px/1 var(--font-body);text-decoration:none;white-space:nowrap;transition:transform .15s var(--ease),background-color .2s}
.btn:active{transform:scale(.97)}
.btn-ink{background:var(--ink);color:#fff}.btn-ink:hover{background:var(--ink-2)}
.btn-lime{background:var(--lime);color:var(--ink)}.btn-lime:hover{background:var(--lime-deep)}
.btn-ghost{border-color:currentColor;background:transparent}
.btn-block{width:100%}
.btn:disabled{background:#D9D6CF;color:#6C6C67;cursor:not-allowed;border-color:transparent}
.btn svg.i{width:18px;height:18px}
.link-arrow{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-decoration:none;min-height:44px;white-space:nowrap}
.link-arrow svg.i{width:18px;height:18px;transition:transform .2s var(--ease)}
.link-arrow:hover svg.i{transform:translateX(3px)}
.link-arrow span{background:linear-gradient(var(--lime),var(--lime)) 0 100%/100% 4px no-repeat}
.link-btn{background:none;border:0;padding:6px 0;min-height:32px;color:var(--muted);text-decoration:underline;font-size:13px}

/* ---------- announcement + header ---------- */
.announce{background:var(--ink);color:#EDEDE6;font-size:12.5px;font-weight:600;letter-spacing:.02em;text-align:center;padding:8px var(--gutter)}
.announce b{color:var(--lime)}
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(244,241,234,.94);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s}
.header-inner{display:flex;align-items:center;gap:12px;height:var(--header-h);transition:height .25s var(--ease);position:relative}
.site-header.is-compact{border-color:var(--line);box-shadow:0 6px 20px -16px rgba(0,0,0,.4)}
.site-header.is-compact .header-inner{height:calc(var(--header-h) - 10px)}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto;padding:6px 6px 6px 0}
.logo-mark{width:36px;height:36px;flex:none}
.logo-word{display:flex;flex-direction:column;line-height:1}
.logo-word b{font:800 17px/1 var(--font-display);letter-spacing:-.01em}
.logo-word small{font:700 9.5px/1 var(--font-body);letter-spacing:.38em;margin-top:4px;padding-bottom:4px;border-bottom:3px solid var(--lime);width:max-content}
.logo-light{color:#fff}.logo-light .logo-mark rect{fill:#fff}.logo-light .logo-mark path{stroke:var(--ink)}
.main-nav{display:none}
.header-actions{display:flex;align-items:center;gap:2px}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:44px;height:44px;border:0;border-radius:var(--r-pill);background:transparent;color:var(--ink)}
.icon-btn:hover{background:rgba(20,20,20,.06)}
.cart-count{position:absolute;top:3px;right:1px;min-width:19px;height:19px;padding:0 5px;border-radius:var(--r-pill);background:var(--lime);color:var(--ink);font:800 11px/19px var(--font-body);text-align:center;box-shadow:0 0 0 2px var(--bg);transform:scale(0);transition:transform .2s var(--ease)}
.cart-count.has-items{transform:scale(1)}
.cart-count.bump{animation:bump .4s var(--ease)}
@keyframes bump{40%{transform:scale(1.4)}}
/* compact header for phones (most are 360–430px wide): logo + five icons must fit on one line */
@media (max-width:449px){
  .header-inner{gap:4px}.logo{gap:8px;padding-right:0}.logo-mark{width:34px;height:34px}
  .logo-word b{font-size:15px}.logo-word small{font-size:8px;letter-spacing:.3em}
  .header-actions{gap:0}.icon-btn{width:40px;height:44px}
}
@media (max-width:379px){.logo-mark{width:32px;height:32px}.logo-word b{font-size:14px}}
@media (max-width:299px){.logo-word{display:none}}
@media (min-width:1024px){
  .menu-btn{display:none}
  .logo-mark{width:40px;height:40px}.logo-word b{font-size:19px}
  .main-nav{display:flex;gap:6px;position:absolute;left:50%;transform:translateX(-50%)}
  .main-nav a{position:relative;padding:10px 16px;text-decoration:none;font-weight:600;font-size:15px;border-radius:var(--r-pill)}
  .main-nav a:hover{background:rgba(20,20,20,.06)}
  .main-nav a[aria-current="page"]::after{content:"";position:absolute;left:16px;right:16px;bottom:4px;height:4px;border-radius:2px;background:var(--lime)}
}

/* ---------- panels ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(20,20,20,.45);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.panel{position:fixed;z-index:70;top:0;bottom:0;right:0;width:min(420px,100%);background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateX(100%);transition:transform .26s var(--ease);box-shadow:var(--shadow-lg)}
.panel.is-open{transform:none}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 20px;border-bottom:1px solid var(--line)}
.panel-title{font:800 20px/1 var(--font-display)}
.mobile-nav{overflow-y:auto}
.mobile-links{display:flex;flex-direction:column;padding:12px 20px}
.mobile-links a{font:800 34px/1.25 var(--font-display);letter-spacing:-.02em;text-decoration:none;padding:6px 0}
.mobile-links a[aria-current="page"]{text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:6px;text-underline-offset:4px}
.mobile-label{padding:12px 20px 8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mobile-cats{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 20px}
.mobile-cats a{min-height:44px;display:inline-flex;align-items:center;padding:0 16px;border:1.5px solid var(--ink);border-radius:var(--r-pill);text-decoration:none;font-weight:600}
.mobile-nav .social{padding:8px 20px 24px;margin-top:auto}
.search-panel{position:fixed;z-index:70;left:0;right:0;top:0;background:var(--bg);box-shadow:var(--shadow-lg);padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:14px;transform:translateY(-100%);transition:transform .24s var(--ease)}
.search-panel.is-open{transform:none}
.search-row{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:4px}
.search-row input{flex:1;min-width:0;height:52px;border:0;background:transparent;font:700 22px var(--font-display);outline:none}
.search-results{list-style:none;margin:8px 0 0;padding:0;max-height:60vh;overflow-y:auto}
.search-results a{display:flex;align-items:center;gap:14px;padding:8px 0;text-decoration:none;border-bottom:1px solid var(--line)}
.search-results img{width:48px;height:60px;border-radius:8px;object-fit:cover}
.search-results .sr-txt{flex:1;display:flex;flex-direction:column;min-width:0}
.search-results small{color:var(--muted)}
.search-results .sr-price{font-weight:700;font-variant-numeric:tabular-nums}
.search-empty{padding:16px 0;color:var(--muted)}

/* mini cart */
.cart-body{flex:1;overflow-y:auto;padding:8px 20px}
.cart-lines{list-style:none;margin:0;padding:0}
.cart-line{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.cart-line img{width:72px;height:90px;border-radius:var(--r-sm);object-fit:cover}
.cl-info{display:flex;flex-direction:column;gap:4px;min-width:0}
.cl-name{font-weight:700;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-var{font-size:13px;color:var(--muted)}
.cl-side{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;font-variant-numeric:tabular-nums}
.cart-foot{padding:16px 20px 20px;border-top:1px solid var(--line);display:grid;gap:10px;background:var(--surface)}
.ship-meter{font-size:14px}
.meter{height:6px;border-radius:3px;background:var(--stone);overflow:hidden}
.meter span{display:block;height:100%;background:var(--ink);border-radius:3px;transition:width .4s var(--ease)}
.cart-total{display:flex;justify-content:space-between;font-size:18px;padding-top:4px;font-variant-numeric:tabular-nums}
.cart-foot .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cart-note{font-size:13px;color:var(--muted);text-align:center}
.cart-empty{display:grid;gap:10px;justify-items:start;padding:32px 0}
.cart-empty .btn{margin-top:8px}

/* toast */
.toast{position:fixed;z-index:80;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;align-items:center;gap:12px;width:min(440px,calc(100% - 32px));padding:10px 10px 10px 12px;border-radius:var(--r-md);background:var(--ink);color:#fff;box-shadow:var(--shadow-lg);transform:translate(-50%,20px);opacity:0;transition:transform .25s var(--ease),opacity .25s;font-size:14px}
.toast.is-open{transform:translate(-50%,0);opacity:1}
.toast img{width:44px;height:55px;border-radius:8px;object-fit:cover}
.toast .t-txt{flex:1;min-width:0}
.toast b{display:block}
.toast .t-txt span{color:#CFCFC8;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast-link{background:var(--lime);border:0;color:var(--ink);font-weight:800;min-height:44px;padding:0 14px;border-radius:var(--r-pill)}
body.has-sticky .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 86px)}
@media (min-width:768px){.toast,body.has-sticky .toast{bottom:28px;left:auto;right:28px;transform:translateY(20px)}.toast.is-open{transform:none}}

/* ---------- price & badges ---------- */
.price{display:flex;align-items:center;flex-wrap:nowrap;gap:8px;font-variant-numeric:tabular-nums;min-width:0}
.price-now{font-weight:800;color:var(--ink);white-space:nowrap}
.price-now.is-sale{background:var(--lime);padding:1px 7px;border-radius:6px}
.price-was{color:var(--muted);text-decoration-color:var(--gray);font-size:.88em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.price-off{font-size:11px;font-weight:800;letter-spacing:.04em;color:#fff;background:var(--ink);padding:3px 6px;border-radius:6px;white-space:nowrap}
.badge{position:absolute;top:10px;left:10px;z-index:2;font:800 10.5px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;padding:6px 9px;border-radius:var(--r-pill)}
.badge.inline{position:static;display:inline-block}
.badge-lime{background:var(--lime);color:var(--ink)}
.badge-ink{background:var(--ink);color:#fff}
.badge-light{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}

/* ---------- product card ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}
@media (min-width:768px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:32px 20px}}
@media (min-width:1024px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 24px}}
/* beside the filters there's less room: three columns until the screen is wide enough for four */
@media (min-width:1024px) and (max-width:1279px){.shop-layout .grid:not(.is-large){grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{position:relative;display:flex;flex-direction:column;min-width:0}
.card-media{position:relative;display:block;aspect-ratio:4/5;max-width:100%;border-radius:var(--r-md);overflow:hidden;background:var(--stone);transition:box-shadow .25s var(--ease),transform .15s var(--ease)}
.card-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s var(--ease),transform .6s var(--ease)}
.card-media .img-alt{opacity:0}
@media (hover:hover){.card:hover .card-media{box-shadow:var(--shadow-lg)}.card:hover .img-alt{opacity:1}.card:hover .img-main{transform:scale(1.03)}}
.card-media.show-alt .img-alt{opacity:1}
.card:active .card-media{transform:scale(.98)}
.wish{position:absolute;top:6px;right:6px;z-index:3;width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent}
.wish svg.i{width:34px;height:34px;padding:7px;border-radius:50%;background:rgba(255,255,255,.92);stroke-width:2;transition:transform .2s var(--ease)}
.wish[aria-pressed="true"] svg.i{fill:var(--ink)}
.wish:active svg.i{transform:scale(.85)}
.card-body{display:grid;column-gap:8px;padding-top:12px}
.card-cat{grid-area:cat;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* names show in full over up to two lines; the space for two lines is always kept so cards line up */
.card-name{grid-area:name;font:700 15px/1.3 var(--font-body);letter-spacing:0;margin-top:2px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;min-height:2.6em}
.card-rating{grid-area:rating;min-height:18px;display:flex;align-items:center}
@media (max-width:767px){.card-name{font-size:14px}}
@media (max-width:400px){.card-name{font-size:13px;letter-spacing:-.01em}.card-cat{font-size:10.5px}}
.card-name a{text-decoration:none}
.card-name a::after{content:"";position:absolute;inset:0 0 auto 0;aspect-ratio:4/5;z-index:1}
.card-price{grid-area:price;min-height:28px;margin-top:4px;font-size:15px;display:flex;align-items:center;flex-wrap:wrap;gap:0 6px}
.card-price .price-off{display:none}
.card-foot{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.card-details{position:relative;z-index:2;font-size:12.5px;font-weight:700;text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:3px;text-underline-offset:3px;white-space:nowrap;padding:8px 0}
.card-swatches{display:flex;gap:2px}
.card-swatches span{width:12px;height:12px;border-radius:50%;background:var(--sw);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.card.is-soldout .card-media img{opacity:.5;filter:grayscale(.6)}
.card.is-soldout:hover .img-alt{opacity:0}

/* ---------- add to cart ---------- */
.btn-atc{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:44px;min-height:44px;border:0;border-radius:var(--r-pill);background:var(--lime);color:var(--ink);font:800 15px/1 var(--font-body);transition:background-color .2s,transform .15s var(--ease)}
.btn-atc:hover:not(:disabled){background:var(--lime-deep)}
.btn-atc:active:not(:disabled){transform:scale(.96)}
.btn-atc:disabled{background:#D9D6CF;color:#6C6C67;cursor:not-allowed}
.btn-atc .atc-spin,.btn-atc .atc-ok,.btn-atc .atc-done{display:none}
.btn-atc.is-loading{pointer-events:none}
.btn-atc.is-loading .atc-ico,.btn-atc.is-loading .atc-label{display:none}
.btn-atc.is-loading .atc-spin{display:block;width:18px;height:18px;border:2.5px solid var(--ink);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.btn-atc.is-added{background:var(--ink);color:var(--lime);pointer-events:none}
.btn-atc.is-added .atc-ico,.btn-atc.is-added .atc-label{display:none}
.btn-atc.is-added .atc-ok,.btn-atc.is-added .atc-done{display:inline-flex}
.btn-atc.is-added .atc-ok svg.i{stroke-width:3;animation:pop .35s var(--ease)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.3)}}
/* a full-width Add to Cart under the price on every screen size, so prices never get squeezed */
.card-body{grid-template-columns:minmax(0,1fr);grid-template-areas:"cat" "name" "price" "rating" "add"}
.quick-add{grid-area:add;width:100%;margin-top:4px;padding:0 10px;font-size:14px;min-height:42px}
.quick-add svg.i{width:18px;height:18px;stroke-width:2.2}
.quick-add .atc-done{display:none!important}
.btn-atc.quick-add.is-added .atc-done{display:inline!important}
@media (min-width:1024px){.quick-add{margin-top:6px;min-height:44px}}

/* ---------- sections ---------- */
.section{padding-block:44px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:4px 16px;flex-wrap:wrap;margin-bottom:18px}
.section-head h2{font-size:clamp(28px,6vw,48px);font-weight:800}
@media (min-width:1024px){.section{padding-block:80px}.section-head{margin-bottom:32px}}

/* ---------- home ---------- */
.hero{padding-top:10px}
.hero-card{position:relative;overflow:hidden;border-radius:var(--r-lg);background:#2b2a27;color:#fff;min-height:360px;display:flex;align-items:flex-end}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:72% 40%}
.hero-card::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(20,20,20,.94) 22%,rgba(20,20,20,.45) 58%,rgba(20,20,20,0) 85%)}
.hero-copy{position:relative;z-index:2;padding:22px;display:grid;gap:12px;justify-items:start}
.hero-copy h1{font-size:clamp(36px,10vw,96px);font-weight:800;line-height:.92;letter-spacing:-.035em}
.hero-copy h1 em{font-style:normal;color:var(--ink);background:var(--lime);padding:0 .12em;border-radius:.14em}
.hero-copy p{color:#DADAD3;font-size:15px;max-width:36ch;display:none}
@media (min-width:480px){.hero-copy p{display:block}}
@media (min-width:768px){
  .hero-card{min-height:480px;align-items:center}
  .hero-card::after{background:linear-gradient(90deg,rgba(20,20,20,.94) 18%,rgba(20,20,20,.6) 46%,rgba(20,20,20,0) 72%)}
  .hero-copy{padding:48px 44px;max-width:620px;gap:18px}
  .hero-copy p{font-size:17px}
  .hero-img{object-position:center}
}
@media (min-width:1024px){.hero-card{min-height:580px}.hero-copy{padding-left:64px}}
.cats-section{padding-top:22px}
.cats-section .section-head{margin-bottom:12px}
.cats-section .section-head h2{font-size:clamp(22px,5vw,36px)}
.cat-tiles{display:grid;grid-auto-flow:column;grid-auto-columns:32%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none;margin-inline:calc(var(--gutter)*-1);padding-inline:var(--gutter);scroll-padding-inline:var(--gutter)}
.cat-tiles::-webkit-scrollbar{display:none}
.cat-tile{position:relative;scroll-snap-align:start;display:block;aspect-ratio:1;max-width:100%;border-radius:var(--r-md);overflow:hidden;text-decoration:none;background:var(--stone)}
.cat-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.cat-tile:hover img{transform:scale(1.05)}
.cat-tile .tile-label{position:absolute;left:6px;right:6px;bottom:6px;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:4px;background:var(--ink);color:#fff;border-radius:var(--r-pill);padding:8px 8px 8px 12px;font:700 12.5px/1 var(--font-body);white-space:nowrap}
.cat-tile .tile-label svg.i{width:15px;height:15px;color:var(--lime)}
@media (min-width:480px){.cat-tiles{grid-auto-columns:26%}}
@media (min-width:768px){
  .cat-tiles{grid-auto-flow:row;grid-template-columns:repeat(6,1fr);overflow:visible;margin-inline:0;padding-inline:0;gap:16px}
  .cat-tile{aspect-ratio:4/5}
  .cat-tile .tile-label{left:12px;right:12px;bottom:12px;padding:12px 12px 12px 16px;font-size:15px}
  .cats-section{padding-top:56px}
}
.featured{padding-top:26px}
.featured-row{display:grid;grid-auto-flow:column;grid-auto-columns:46%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:calc(var(--gutter)*-1);padding-inline:var(--gutter);scroll-padding-inline:var(--gutter);padding-bottom:10px;scrollbar-width:thin}
.featured-row .card{scroll-snap-align:start}
@media (min-width:768px){.featured-row{grid-auto-columns:31%;gap:20px}}
@media (min-width:1024px){.featured-row{grid-auto-flow:row;grid-template-columns:repeat(4,minmax(0,1fr));overflow:visible;margin-inline:0;padding-inline:0;gap:40px 24px}}
.promo-split{display:grid;gap:14px}
.promo{position:relative;border-radius:var(--r-lg);overflow:hidden;min-height:300px;display:flex;align-items:flex-end;text-decoration:none;color:#fff;background:var(--ink)}
.promo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.promo:hover img{transform:scale(1.04)}
.promo::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(20,20,20,.85),rgba(20,20,20,0) 60%)}
.promo-txt{position:relative;z-index:2;padding:22px;display:grid;gap:8px;justify-items:start}
.promo-txt h3{font-size:clamp(26px,5vw,40px);font-weight:800}
@media (min-width:768px){.promo-split{grid-template-columns:1fr 1fr;gap:20px}.promo{min-height:420px}.promo-txt{padding:32px}}
.ticker{overflow:hidden;border-block:2px solid var(--ink);background:var(--bg)}
.ticker-track{display:flex;width:max-content;animation:ticker 32s linear infinite}
.ticker span{font:800 15px/1 var(--font-display);text-transform:uppercase;padding:12px 18px;white-space:nowrap;display:inline-flex;gap:18px;align-items:center}
.ticker span::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 1.5px var(--ink)}
@keyframes ticker{to{transform:translateX(-50%)}}
.props{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.prop{background:var(--surface);padding:20px 16px;display:grid;gap:6px;align-content:start}
.prop-ico{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:var(--ink);color:var(--lime);margin-bottom:6px}
.prop h3{font:700 16px/1.2 var(--font-body);letter-spacing:0}
.prop p{font-size:14px;color:var(--muted)}
@media (min-width:1024px){.props{grid-template-columns:repeat(4,1fr)}.prop{padding:28px 24px}}

/* ---------- newsletter + footer ---------- */
.newsletter{background:var(--ink);color:#fff;padding-block:44px;margin-top:24px}
.nl-inner{display:grid;gap:22px}
.nl-copy{display:grid;gap:10px}
.nl-copy h2{font-size:clamp(30px,7vw,54px);font-weight:800}
.nl-copy p{color:#CFCFC8;max-width:46ch}
.nl-form{display:grid;gap:10px}
.nl-form input{height:54px;padding:0 20px;border-radius:var(--r-pill);border:2px solid #3A3A38;background:#1F1F1E;color:#fff;min-width:0}
.nl-form input::placeholder{color:#8F8F88}
.nl-form input:focus{outline:none;border-color:var(--lime)}
.nl-form input[aria-invalid="true"]{border-color:#FF8A80}
.nl-form .btn{height:54px}
.nl-note{font-size:13px;color:#A5A59E;margin-top:10px}
.newsletter .field-error{color:#FFB4AB;margin-top:8px}
.nl-success{display:flex;gap:14px;align-items:center;padding:18px 20px;border-radius:var(--r-md);background:#1F1F1E;border:2px solid var(--lime)}
.nl-success svg.i{color:var(--ink);background:var(--lime);border-radius:50%;padding:6px;width:34px;height:34px;stroke-width:2.6}
@media (min-width:768px){.nl-form{grid-template-columns:1fr auto}.newsletter{padding-block:64px}}
@media (min-width:1024px){.nl-inner{grid-template-columns:1.1fr 1fr;align-items:center;gap:48px}}
.site-footer{background:var(--ink);color:#D6D6CF;border-top:1px solid #2B2B29;padding-top:40px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
.footer-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px 20px}
.f-brand{grid-column:1/-1;display:grid;gap:14px;justify-items:start}
.f-brand p{max-width:36ch;font-size:14px}
.site-footer h3{font:700 12px/1 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:#fff;margin-bottom:10px}
.site-footer ul{list-style:none;margin:0;padding:0}
.site-footer li a{display:inline-flex;min-height:36px;align-items:center;text-decoration:none;font-size:15px}
.site-footer li a:hover{color:#fff;text-decoration:underline;text-decoration-color:var(--lime)}
.f-contact li{font-size:14px;padding:5px 0;overflow-wrap:anywhere}
.f-base{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:36px;padding-top:18px;border-top:1px solid #2B2B29;font-size:13px;color:#9C9C95}
.pay-icons{display:flex;gap:6px;flex-wrap:wrap}
.pay-icons span{border:1px solid #3A3A38;border-radius:6px;padding:4px 8px;font-size:11px;font-weight:700;letter-spacing:.06em;color:#CFCFC8}
.social{display:flex;gap:8px;list-style:none;margin:0;padding:0}
.social a{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:1.5px solid currentColor}
.social a:hover{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.social svg.i{width:19px;height:19px}
@media (min-width:768px){.footer-grid{grid-template-columns:1.6fr 1fr 1fr 1.2fr}.f-brand{grid-column:auto}}

/* ---------- forms ---------- */
.field{display:grid;gap:6px;min-width:0}
.field label,.field .lbl{font-weight:700;font-size:14px}
.req{color:var(--danger)}
.field input,.field select,.field textarea{width:100%;min-height:50px;padding:12px 16px;border-radius:var(--r-sm);border:1.5px solid #BDB8AC;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.field textarea{min-height:140px;resize:vertical}
.field select,.sort select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:44px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px var(--lime)}
.field [aria-invalid="true"]{border-color:var(--danger)}
.field-error{color:var(--danger);font-size:13.5px;font-weight:500}
.field-meta{display:flex;justify-content:space-between;gap:12px}
.field-meta small{color:var(--muted);font-variant-numeric:tabular-nums}
.form-row{display:grid;gap:18px}
@media (min-width:768px){.form-row{grid-template-columns:1fr 1fr}}

/* ---------- shop ---------- */
.page-head{padding-top:22px;display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head h1{font-size:clamp(38px,9vw,80px);font-weight:800}
.page-head .count{color:var(--muted);font-weight:600;padding-bottom:6px;white-space:nowrap}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted);margin-bottom:10px}
.crumbs a{text-decoration:none}.crumbs a:hover{text-decoration:underline}
.crumbs [aria-current]{color:var(--ink);font-weight:600}
.cat-bar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:16px 4px}
.cat-bar::-webkit-scrollbar{display:none}
.cat-bar a{flex:none;display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:var(--r-pill);border:1.5px solid var(--ink);text-decoration:none;font-weight:600;font-size:15px}
.cat-bar a:hover{background:rgba(20,20,20,.06)}
.cat-bar a[aria-current]{background:var(--ink);color:#fff}
.shop-layout{display:grid;gap:24px;padding-top:12px;padding-bottom:56px}
.toolbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--header-h) - 10px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;margin-bottom:8px;background:var(--bg)}
.filter-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r-pill);border:1.5px solid var(--ink);background:var(--surface);font-weight:700}
.filter-btn svg.i{width:18px;height:18px}
.filter-count{min-width:20px;height:20px;border-radius:10px;background:var(--lime);font-size:12px;line-height:20px;text-align:center;box-shadow:0 0 0 1.5px var(--ink)}
.sort{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.sort select{min-height:44px;border-radius:var(--r-pill);border:1.5px solid #BDB8AC;background-color:var(--surface);padding-left:14px;background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px}
.filters.panel{top:auto;left:0;right:0;width:100%;max-height:86vh;border-radius:var(--r-lg) var(--r-lg) 0 0;transform:translateY(100%)}
.filters.panel.is-open{transform:none}
.grabber{width:44px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
.filters-body{overflow-y:auto;padding:8px 20px 12px;display:grid;gap:22px}
.f-group{border:0;margin:0;padding:0;display:grid;gap:12px}
.f-group legend{font:800 17px/1 var(--font-display);padding:0;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-check,.swatch-check{position:relative}
.chip-check input,.swatch-check input{position:absolute;opacity:0;width:1px;height:1px}
.chip-check span{display:inline-flex;align-items:center;min-height:44px;min-width:52px;justify-content:center;padding:0 14px;border-radius:var(--r-sm);border:1.5px solid #BDB8AC;background:var(--surface);font-weight:600;font-size:14px;cursor:pointer}
.chip-check input:checked+span{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip-check input:focus-visible+span,.swatch-check input:focus-visible+.sw{outline:3px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 6px var(--lime)}
.swatches-f{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:2px 10px}
.swatch-check{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-size:14px}
.swatch-check .sw{width:26px;height:26px;border-radius:50%;background:var(--sw);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);flex:none}
.swatch-check input:checked+.sw{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.swatch-check input:checked~.sw-name{font-weight:700}
.range-row{display:grid;gap:8px}
.range-row output{font-weight:700;font-variant-numeric:tabular-nums}
input[type="range"]{width:100%;accent-color:var(--ink);min-height:44px}
.filters-foot{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:12px 20px 16px;border-top:1px solid var(--line);background:var(--surface)}
.load-more-wrap{display:grid;justify-items:center;gap:10px;margin-top:40px;font-size:14px;color:var(--muted)}
.load-more-wrap .meter{width:200px}
.empty{text-align:center;padding:56px 16px;border:2px dashed var(--line);border-radius:var(--r-lg);display:grid;gap:12px;justify-items:center}
.empty h2{font-size:28px}.empty p{color:var(--muted);max-width:40ch}
@media (min-width:1024px){
  .shop-layout{grid-template-columns:250px minmax(0,1fr);gap:40px}
  .filters.panel{position:sticky;top:calc(var(--header-h) + 8px);transform:none;box-shadow:none;width:auto;max-height:calc(100vh - var(--header-h) - 24px);background:transparent;border-radius:0;z-index:1;align-self:start;padding:0}
  .filters .grabber,.filters [data-close],#apply-filters{display:none}
  .filters .panel-head{padding:10px 0 14px}
  .filters-body{padding:16px 0}
  .filters-foot{grid-template-columns:1fr;padding:16px 0;background:transparent}
  .filter-btn{display:none}
  .toolbar{justify-content:flex-end}
}

/* ---------- product ---------- */
.pdp{padding-top:12px;padding-bottom:32px}
.pdp-grid{display:grid;gap:22px}
.gallery{min-width:0}
.g-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:calc(var(--gutter)*-1)}
.g-track::-webkit-scrollbar{display:none}
.g-track.zooming{scroll-snap-type:none;overflow:hidden}
.g-slide{flex:0 0 100%;margin:0;scroll-snap-align:start;aspect-ratio:4/5;max-width:100%;overflow:hidden;background:var(--stone);cursor:zoom-in}
.g-slide img{width:100%;height:100%;object-fit:cover;transition:transform .3s var(--ease);transform-origin:var(--ox,50%) var(--oy,50%)}
/* studio photos are taller than the 4:5 frames: keep heads in view on cards, show the whole outfit on the product page */
img[src^="photos/"]{object-position:50% 16%}
.team-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:700px){.team-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1024px){.team-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}}
.team-card{margin:0;border-radius:var(--r-md);overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.team-card img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 20%;transition:transform .5s var(--ease)}
.team-card:hover img{transform:scale(1.03)}
.team-card figcaption{display:grid;gap:2px;padding:12px 14px}
.team-card figcaption b{font-weight:800}
.team-card figcaption span{color:var(--muted);font-size:14px}
.g-slide img[src^="photos/"]{object-fit:contain;background:#E9E7E3}
.g-slide.is-zoomed{cursor:zoom-out}
.g-slide.is-zoomed img{transform:scale(2.2)}
.g-dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.g-dots span{width:7px;height:7px;border-radius:50%;background:var(--line);transition:width .2s}
.g-dots span.on{width:22px;border-radius:4px;background:var(--ink)}
.g-thumbs{display:none}
.g-hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:6px}
@media (min-width:768px){
  .g-track{margin-inline:0;border-radius:var(--r-lg)}
  .g-dots{display:none}
  .g-thumbs{display:flex;gap:10px;margin-top:12px}
  .g-thumbs button{width:76px;padding:0;border:2px solid transparent;border-radius:12px;overflow:hidden;background:var(--stone)}
  .g-thumbs button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--lime)}
  .g-thumbs img{aspect-ratio:4/5;width:100%;object-fit:cover}
  .g-hint{text-align:left}
}
.pdp-info{display:grid;gap:14px;align-content:start;min-width:0}
.tag-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cat-tag{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border-radius:var(--r-pill);background:var(--ink);color:#fff;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-decoration:none}
.pdp-name{font-size:clamp(30px,6.5vw,54px);font-weight:800}
.pdp-price{font-size:24px}
.sku{font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.avail{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--muted)}
.avail::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--gray)}
.avail.is-in{color:var(--ok)}.avail.is-in::before{background:#3C9A3C}
.avail.is-low{color:#8A4B00}.avail.is-low::before{background:#E08A00}
.avail.is-out{color:var(--danger)}.avail.is-out::before{background:var(--danger)}
.opt{border:0;margin:0;padding:0;min-width:0}
.opt legend{font-size:14px;margin-bottom:10px;padding:0;color:var(--muted);width:100%}
.opt legend b{color:var(--ink)}
.opt-note{font-size:13px;color:var(--muted);margin-top:8px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{position:relative;width:44px;height:44px;border-radius:50%;border:0;background:var(--sw);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.swatch.is-oos::after{content:"";position:absolute;left:50%;top:4px;bottom:4px;width:2px;background:var(--danger);transform:rotate(45deg)}
.sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
.size{min-height:48px;border-radius:var(--r-sm);border:1.5px solid #BDB8AC;background:var(--surface);font-weight:700;font-size:15px}
.size:hover:not(.is-oos){border-color:var(--ink)}
.size[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.size.is-oos{color:#9A9A94;border-style:dashed;cursor:not-allowed;text-decoration:line-through;background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(20,20,20,.06) 6px 7px),var(--bg)}
.buy-row{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:4px}
.qty{display:inline-flex;align-items:center;border:1.5px solid #BDB8AC;border-radius:var(--r-pill);background:var(--surface)}
.qty button{width:44px;height:50px;display:grid;place-items:center;border:0;background:none;border-radius:var(--r-pill)}
.qty button:disabled{color:#B5B5AF;cursor:not-allowed}
.qty button svg.i{width:18px;height:18px}
.qty output,.qty span{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.qty-sm{justify-self:start;margin-top:4px}
.qty-sm button{width:36px;height:36px}
.btn-atc-lg{width:100%;min-height:54px;font-size:16px}
.wish-lg{display:inline-flex;align-items:center;gap:8px;background:none;border:0;min-height:44px;font-weight:600;justify-self:start}
.wish-lg[aria-pressed="true"] svg.i{fill:var(--ink)}

.mega-promo small{color:var(--lime);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:11px}
.mega-promo b{font:800 22px/1.1 var(--font-display)}
/* search panel */
.search-body{max-height:70vh;overflow-y:auto;padding:14px 0 4px}
.search-cols{display:grid;gap:18px}
@media (min-width:768px){.search-cols{grid-template-columns:1fr 1.3fr;gap:40px}}
.search-body h3{font:800 12px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 10px}
.search-body h3 small{font-weight:600}
.sr-head{display:flex;justify-content:space-between;align-items:center}.sr-head h3{margin:14px 0 6px}
.sr-chips{display:flex;flex-wrap:wrap;gap:8px}
.sr-chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:var(--r-pill);border:1.5px solid var(--line);background:var(--surface);text-decoration:none;font-size:14px;font-weight:600}
.sr-chip svg.i{width:15px;height:15px;color:var(--muted)}
.sr-chip:hover,.sr-chip.is-active{border-color:var(--ink)}
.sr-prod{display:flex;align-items:center;gap:14px;padding:8px;border-radius:var(--r-sm);text-decoration:none}
.sr-prod:hover,.sr-prod.is-active{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--ink)}
.sr-prod img{width:48px;height:60px;border-radius:8px;object-fit:cover}
.sr-prod mark{background:var(--lime);color:var(--ink);border-radius:3px;padding:0 1px}
.sr-all{display:flex;justify-content:center;margin-top:10px;min-height:44px;align-items:center;border-radius:var(--r-pill);background:var(--ink);color:#fff;text-decoration:none;font-weight:700;font-size:14px}
.sr-all.is-active{box-shadow:0 0 0 3px var(--lime)}
.search-empty a{font-weight:700}
/* modal (quick view, size finder) */
.modal{position:fixed;inset:0;z-index:75;display:flex;align-items:flex-end;justify-content:center;padding:0;opacity:0;transition:opacity .2s var(--ease)}
.modal.is-open{opacity:1}
.modal-card{position:relative;width:100%;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:22px 18px calc(env(safe-area-inset-bottom,0px) + 20px);box-shadow:var(--shadow-lg);transform:translateY(24px);transition:transform .25s var(--ease)}
.modal.is-open .modal-card{transform:none}
.modal-x{position:absolute;top:10px;right:10px;z-index:2;background:var(--surface)}
@media (min-width:768px){.modal{align-items:center;padding:24px}.modal-card{border-radius:var(--r-lg);max-width:980px;padding:28px}}
.qv-card{display:grid;gap:20px}
@media (min-width:768px){.qv-card{grid-template-columns:1fr 1fr;gap:32px}}
.qv-media img#qv-img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:var(--r-md);background:var(--stone)}
.qv-thumbs{display:flex;gap:8px;margin-top:10px}
.qv-thumbs button{width:60px;padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;background:var(--stone)}
.qv-thumbs button[aria-pressed="true"]{border-color:var(--ink)}
.qv-thumbs img{aspect-ratio:4/5;width:100%;object-fit:cover}
.qv-info{display:grid;gap:12px;align-content:start}
.qv-info h2{font-size:clamp(26px,4vw,36px);font-weight:800;padding-right:44px}
.qv-links{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.fit-card{max-width:560px;display:grid;gap:12px}
.fit-card h2{font-size:26px;font-weight:800;padding-right:44px}
.fit-card .sizes{grid-template-columns:repeat(6,1fr)}
.fit-card .chip-check span{width:100%;min-width:0}
.fit-result{margin-top:6px;padding:18px;border-radius:var(--r-md);background:var(--surface);border:1.5px solid var(--ink);display:grid;gap:8px;justify-items:start}
.fit-result span{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fit-result b{font:800 44px/1 var(--font-display)}
.fit-btn{display:inline-flex;align-items:center;gap:8px;margin-top:10px;background:none;border:0;padding:6px 0;min-height:36px;font-weight:700;font-size:14px;text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:3px;text-underline-offset:4px}
.fit-btn svg.i{width:18px;height:18px}
.fit-rec{display:block;font-size:13.5px;color:var(--ok);margin-top:4px}
/* product card interactions */
.card-media-wrap{position:relative;border-radius:var(--r-md);overflow:hidden}
.card-hover{position:absolute;left:8px;right:8px;bottom:8px;z-index:2;display:none;gap:6px;flex-direction:column;align-items:stretch}
@media (hover:hover) and (min-width:1024px){
  .card-hover{display:flex;opacity:0;transform:translateY(8px);transition:opacity .2s var(--ease),transform .2s var(--ease)}
  .card:hover .card-hover,.card:focus-within .card-hover{opacity:1;transform:none}
}
.qv-btn{align-self:center;min-height:36px;padding:0 16px;border:0;border-radius:var(--r-pill);background:rgba(255,255,255,.95);font-weight:700;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.qv-btn:hover{background:#fff;box-shadow:0 0 0 2px var(--ink)}
.hover-sizes{background:rgba(251,250,246,.96);border-radius:12px;padding:8px;display:grid;gap:6px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.hover-sizes>span{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.hs-row{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.hs{min-width:38px;min-height:34px;padding:0 8px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:12.5px}
.hs:hover:not(:disabled){background:var(--ink);color:#fff;border-color:var(--ink)}
.hs.is-oos{color:#B0AFA9;text-decoration:line-through;cursor:not-allowed;background:transparent}
.hs.is-added{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.csw{width:24px;height:24px;border-radius:50%;border:0;padding:0;background:transparent;display:grid;place-items:center;position:relative;z-index:2}
.csw::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--sw);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.csw[aria-pressed="true"]::before{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.card .wish[aria-pressed="true"] svg.i{animation:pop .35s var(--ease)}
.fly-img{position:fixed;z-index:90;pointer-events:none;border-radius:12px;object-fit:cover;box-shadow:var(--shadow-lg)}
/* grid density */
.density{display:flex;gap:4px;margin-left:auto}
.density button{width:40px;height:40px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted)}
.density button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.density svg.i{width:18px;height:18px}
.toolbar{flex-wrap:wrap}
.grid.is-large{grid-template-columns:minmax(0,1fr)}
@media (min-width:480px){.grid.is-large{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1024px){.grid.is-large{grid-template-columns:repeat(3,minmax(0,1fr))}}
.active-filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.active-filters:empty{display:none}
.af-chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px 0 14px;border-radius:var(--r-pill);border:0;background:var(--ink);color:#fff;font-size:13.5px;font-weight:600}
.af-chip svg.i{width:14px;height:14px}
.af-chip:hover{background:var(--ink-2)}
.link-plain{background:none;border:0;padding:0;font:inherit;cursor:pointer}
/* hero slideshow */
.hero-card{isolation:isolate}
.hero-card::after{display:none}
.hero-slide{position:absolute;inset:0;display:flex;align-items:flex-end;opacity:0;visibility:hidden;transition:opacity .7s var(--ease),visibility 0s linear .7s}
.hero-slide.on{opacity:1;visibility:visible;transition:opacity .7s var(--ease)}
.hero-slide::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(20,20,20,.94) 22%,rgba(20,20,20,.45) 58%,rgba(20,20,20,0) 85%);z-index:1}
.hero-slide.on .hero-img{animation:kenburns 9s var(--ease) both}
@keyframes kenburns{from{transform:scale(1.06)}to{transform:scale(1)}}
.hero-slide .hero-copy{z-index:2;padding-bottom:72px}
.hero-copy .h1{font-size:clamp(36px,10vw,96px);font-weight:800;line-height:.92;letter-spacing:-.035em}
.hero-copy .h1 em{font-style:normal;color:var(--ink);background:var(--lime);padding:0 .12em;border-radius:.14em}
.btn-ghost.on-dark{color:#fff}
.btn-ghost.on-dark:hover{background:rgba(255,255,255,.1)}
@media (max-width:479px){.hero-copy .btn-pair .btn-ghost{display:none}}
.hero-ctrl{position:absolute;z-index:3;left:22px;right:22px;bottom:16px;display:flex;align-items:center;gap:6px}
.hero-dots{display:flex;gap:6px;flex:1;max-width:220px}
.hero-dot{flex:1;height:32px;padding:0;border:0;background:none;display:flex;align-items:center}
.hero-dot span{display:block;width:100%;height:3px;border-radius:2px;background:rgba(255,255,255,.35);position:relative;overflow:hidden}
.hero-dot.on span{background:rgba(255,255,255,.55)}
.hero-dot span::after{content:"";position:absolute;inset:0;background:var(--lime);transform:scaleX(0);transform-origin:left}
.hero-dot.on span::after{transform:scaleX(1)}
.hero-dot.run span::after{transform:scaleX(0);animation:heroProg var(--dur,6500ms) linear forwards}
@keyframes heroProg{to{transform:scaleX(1)}}
.hero-nav{width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);background:rgba(20,20,20,.3);color:#fff;display:grid;place-items:center}
.hero-nav:hover{background:rgba(20,20,20,.6)}
.hero-nav svg.i{width:18px;height:18px}
@media (min-width:768px){
  .hero-slide{align-items:center}
  .hero-slide::after{background:linear-gradient(90deg,rgba(20,20,20,.94) 18%,rgba(20,20,20,.6) 46%,rgba(20,20,20,0) 72%)}
  .hero-slide .hero-copy{padding-top:40px;padding-bottom:40px;max-width:600px}
  /* slide controls sit bottom-right, over the photos, so they never collide with the headline or buttons */
  .hero-ctrl{left:auto;right:24px;bottom:20px;padding:4px 6px;border-radius:999px;background:rgba(20,20,20,.35);backdrop-filter:blur(6px)}
  .hero-dots{width:150px;flex:none}
  .hero-copy h1,.hero-copy .h1{font-size:clamp(44px,6.6vw,84px)}
}
/* product page: desktop sticky bar */
@media (min-width:768px){
  body.sticky-desktop .sticky-atc{display:flex;animation:slideUp .25s var(--ease)}
  .sticky-atc .sticky-info{display:grid;gap:2px;flex:1}
  .sticky-atc{padding-inline:max(var(--gutter),calc((100vw - var(--maxw)) / 2 + var(--gutter)))}
}
@keyframes slideUp{from{transform:translateY(100%)}}
/* bag drawer suggestions */
.upsell{padding:18px 0 8px}
.upsell h3{font:800 12px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.upsell-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.up-item{display:grid;gap:4px;align-content:start;font-size:12.5px}
.up-item img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:10px;background:var(--stone)}
.up-item b{font-size:12.5px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.up-item .price{font-size:12.5px}.up-item .price-off,.up-item .price-was{display:none}
.up-add{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:36px;border-radius:var(--r-pill);border:1.5px solid var(--ink);background:none;font-weight:700;font-size:12.5px}
.up-add svg.i{width:14px;height:14px}
.up-add:hover{background:var(--ink);color:#fff}
/* back to top */
.to-top{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:25;width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow-lg)}
body.has-sticky .to-top{bottom:calc(env(safe-area-inset-bottom,0px) + 160px)}
@media (min-width:768px){body.has-sticky .to-top{bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}}
/* ratings & reviews */
.star-bar{position:relative;display:inline-block;font-size:14px;line-height:1;letter-spacing:1px;color:#D2CCBF;vertical-align:middle}
.star-bar::before{content:"★★★★★"}
.star-bar>span{position:absolute;inset:0 auto 0 0;overflow:hidden;white-space:nowrap;color:var(--ink)}
.star-bar>span::before{content:"★★★★★"}
.star-bar.big{font-size:20px}
.stars{display:inline-flex;align-items:center;gap:6px;grid-column:1/-1;margin-top:4px}
.stars small{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stars-big small{font-size:14px}
.rating-link{text-decoration:none;justify-self:start}
.rating-link:hover small{text-decoration:underline}
.rev-grid{display:grid;gap:24px;align-items:start}
@media (min-width:1024px){.rev-grid{grid-template-columns:320px minmax(0,1fr);gap:48px}.rev-summary{position:sticky;top:calc(var(--header-h) + 16px)}}
.rev-summary{display:grid;gap:14px;padding:20px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.rev-avg{display:flex;align-items:center;gap:14px}
.rev-avg>b{font:800 52px/1 var(--font-display)}
.rev-avg>div{display:grid;gap:4px}.rev-avg small{color:var(--muted)}
.rev-dist{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px;font-variant-numeric:tabular-nums}
.rev-dist li{display:grid;grid-template-columns:28px 1fr 24px;gap:8px;align-items:center}
.rev-dist .bar{height:8px;border-radius:4px;background:var(--stone);overflow:hidden}
.rev-dist .bar i{display:block;height:100%;background:var(--ink)}
.fit-meter{display:grid;gap:6px;font-size:14px}
.fit-scale{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--stone),var(--lime) 50%,var(--stone))}
.fit-scale i{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%);box-shadow:0 0 0 3px var(--bg)}
.fit-labels{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.rev-empty{color:var(--ink-2)}
.rev-tools{display:flex;justify-content:flex-end;margin-bottom:10px}
.rev-list{list-style:none;margin:0;padding:0;display:grid}
.rev{padding:18px 0;border-bottom:1px solid var(--line);display:grid;gap:8px}
.rev-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rev p{max-width:70ch}
.rev-meta{font-size:13px;color:var(--muted)}
.verified{display:inline-flex;align-items:center;gap:4px;color:var(--ok);font-weight:700;font-size:12.5px}
.verified svg.i{width:14px;height:14px;stroke-width:3}
.rev-form,.rev-signin{display:grid;gap:12px;padding:20px;border-radius:var(--r-lg);border:1.5px solid var(--ink);background:var(--surface);margin-bottom:18px}
.rev-form h3{font-size:22px;font-weight:800}
.rate{border:0;margin:0;padding:0;display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:2px}
.rate legend{font-weight:700;font-size:14px;margin-bottom:6px;width:100%}
.rate input{position:absolute;opacity:0;width:1px;height:1px}
.rate label{font-size:32px;line-height:1;color:#D2CCBF;cursor:pointer;padding:2px}
.rate label:hover,.rate label:hover~label,.rate input:checked~label{color:var(--ink)}
.rate input:focus-visible+label{outline:3px solid var(--ink);border-radius:6px}
/* back-in-stock, share, returns, tracking */
.notify-form{display:grid;gap:8px;padding:14px;border-radius:var(--r-md);background:#FFF6DC;border:1.5px solid #EBCB6E;font-size:14px}
.notify-row{display:flex;gap:8px}
.notify-row input{flex:1;min-width:0;min-height:40px;padding:0 12px;border-radius:var(--r-sm);border:1.5px solid #BDB8AC;background:#fff}
.notify-done{display:flex;gap:8px;align-items:center;padding:12px 14px;border-radius:var(--r-md);background:#E6F4E4;color:#1F5A1F;font-size:14px;font-weight:600}
.notify-done svg.i{width:18px;height:18px;stroke-width:3}
.wish-share{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.share-row{display:flex;align-items:center;gap:4px}
.share-label{font-size:13px;font-weight:700;color:var(--muted);margin-right:4px}
.share-row a,.share-row button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.share-row a:hover,.share-row button:hover{border-color:var(--ink)}
.share-row svg.i{width:17px;height:17px}
.return-slot:empty{display:none}
.return-slot{padding:0 14px 14px}
.return-form{display:grid;gap:10px;padding:14px;border-radius:var(--r-md);background:var(--surface);border:1.5px solid var(--ink)}
.return-form h4{font:800 16px/1.2 var(--font-body)}
.ret-items{border:0;margin:0;padding:0;display:grid;gap:4px}
.ret-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ret-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);background:#fff;border:1px solid var(--line);font-size:14px}
.oc-foot .btn-pair{gap:6px}
.f-track{color:inherit;margin-left:10px}
.track-page{padding-top:22px;padding-bottom:48px;display:grid;gap:22px}
.track-head{display:grid;gap:8px}
.track-head h1{font-size:clamp(32px,6vw,56px);font-weight:800}
.track-steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
.track-steps li{position:relative;display:grid;grid-template-columns:40px 1fr;column-gap:14px;padding-bottom:22px}
.track-steps li::before{content:"";position:absolute;left:19px;top:40px;bottom:0;width:2px;background:var(--line)}
.track-steps li:last-child::before{display:none}
.track-steps li.done::before{background:var(--ink)}
.ts-dot{grid-row:span 2;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--stone);color:var(--muted);font-weight:800}
.track-steps li.done .ts-dot{background:var(--ink);color:var(--lime)}
.track-steps li.now .ts-dot{box-shadow:0 0 0 4px var(--lime)}
.ts-dot svg.i{width:18px;height:18px;stroke-width:3}
.track-steps b{align-self:end;font-size:17px}.track-steps small{color:var(--muted)}
@media (min-width:768px){.track-steps{grid-template-columns:repeat(4,1fr)}.track-steps li{grid-template-columns:1fr;justify-items:start;padding:0 12px 0 0;row-gap:6px}.track-steps li::before{left:44px;right:0;top:19px;bottom:auto;width:auto;height:2px}.ts-dot{grid-row:auto}}
/* team dashboard */
.ret-admin,.msg-admin{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ret-admin>li{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:var(--r-md);background:#fff;font-size:14px}
.ret-admin ul{margin:6px 0 0;padding-left:18px}
.ret-admin select{min-height:40px;border-radius:var(--r-sm);border:1.5px solid #BDB8AC;padding:0 10px;background:var(--surface)}
.msg-admin>li{display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:var(--r-md);background:#fff;font-size:14.5px}
.msg-admin>li.is-new{box-shadow:inset 4px 0 0 var(--lime)}
.ma-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ma-head small{width:100%}
/* cookie consent */
.consent{position:fixed;z-index:58;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);max-width:560px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 16px;border-radius:var(--r-md);background:var(--ink);color:#fff;box-shadow:var(--shadow-lg);font-size:14px}
.consent p{flex:1;min-width:220px}.consent a{color:var(--lime)}
.consent .btn-ghost{color:#fff}
/* print: receipts and order pages */
@media print{
  .announce,.site-header,.newsletter,.site-footer,.chat-fab,.chat-panel,.to-top,.toast,.sticky-atc,.consent,.btn,.btn-pair,.acct-nav,.steps,.link-btn,.skip-link,#chat-root{display:none!important}
  body{background:#fff;color:#000}
  .summary,.order-card{border:1px solid #999;box-shadow:none;break-inside:avoid}
  .order-grid{grid-template-columns:1fr 1fr}
  a{color:#000;text-decoration:none}
}
/* live chat */

.chat-panel{position:fixed;z-index:56;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);width:min(390px,calc(100vw - 32px));height:min(600px,calc(100vh - 120px));display:flex;flex-direction:column;background:var(--bg);border-radius:var(--r-lg);box-shadow:0 30px 60px -20px rgba(0,0,0,.45),0 0 0 1px var(--line);overflow:hidden;opacity:0;transform:translateY(12px) scale(.98);transform-origin:bottom right;transition:opacity .2s var(--ease),transform .2s var(--ease)}

@media (max-width:479px){.chat-panel{right:0;left:0;bottom:0;width:100%;height:calc(100% - env(safe-area-inset-top,0px) - 40px);border-radius:var(--r-lg) var(--r-lg) 0 0;z-index:65}}

.ph-add:hover,.ph-add.is-over{border-color:var(--ink);background:#fff}
.ph-add.is-busy{opacity:.6;pointer-events:none}
.ph-add:focus-within{outline:3px solid var(--ink)}
.stock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.stock-cell{display:grid;gap:4px;padding:8px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:#fff}
.stock-cell span{font-weight:800;font-size:13px}
.stock-cell input{width:100%;min-height:38px;border:1px solid #D0CBBF;border-radius:8px;padding:0 8px;font-variant-numeric:tabular-nums}
.color-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.color-row input[type=color]{width:44px;height:44px;border:1.5px solid var(--line);border-radius:10px;padding:2px;background:#fff}
.color-row input[type=text]{flex:1;min-height:44px;padding:0 12px;border:1.5px solid #BDB8AC;border-radius:var(--r-sm);background:var(--surface);min-width:0}
.pf-preview .card{pointer-events:none}
.pf-preview .card-hover{display:none!important}

@media (prefers-reduced-motion:reduce){
  .hero-slide.on .hero-img{animation:none}
  .ann{transition:none}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>

function mix(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const t = amt < 0 ? 0 : 255, k = Math.abs(amt);
  r = Math.round(r + (t - r) * k); g = Math.round(g + (t - g) * k); b = Math.round(b + (t - b) * k);
  return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
function lum(hex) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); };
  return .2126 * f((n >> 16) & 255) + .7152 * f((n >> 8) & 255) + .0722 * f(n & 255);
}

  // A slow connection is never a reason to switch: we keep waiting instead.
  const probe = await Promise.race([

let route = { v: "home" }, currentHash = null;
// Links from our branded emails arrive as /?mode=verifyEmail|resetPassword&oobCode=…: remember the code and
// tidy the address bar (so the one-time code isn't left in history), then show the #auth-action page.
const AUTH_ACTION = (() => {
  try {
    const q = new URLSearchParams(location.search), mode = q.get("mode"), code = q.get("oobCode");
    if (!code || !["verifyEmail", "resetPassword"].includes(mode)) return null;
    try { history.replaceState({ h: "auth-action" }, "", location.pathname + "#auth-action"); } catch (e) {}
    return { mode, code };
  } catch (e) { return null; }
})();
// "Continue the chat" links in reply emails arrive as /?chat=<conversation id>: reopen that conversation
const CHAT_RESUME = (() => {
  try {
    const q = new URLSearchParams(location.search), id = q.get("chat");
    if (!id || !/^c[a-z0-9]{20,40}$/.test(id)) return null;
    try { history.replaceState(null, "", location.pathname + (location.hash || "#home")); } catch (e) {}
    return id;
  } catch (e) { return null; }
})();
function parseRoute(raw) {
  const h = decodeURIComponent(String(raw == null ? location.hash : raw).replace(/^#/, ""));
  if (!h || h === "home") return { v: "home" };
  if (h === "shop") return { v: "shop", cat: "all" };
  if (h.startsWith("shop-")) return { v: "shop", cat: h.slice(5) };
  if (h.startsWith("search-")) return { v: "shop", cat: "all", q: h.slice(7).trim() };
  if (h === "wishlist") return { v: "wishlist" };
  if (h === "support" || h.startsWith("support-")) return { v: "support", id: h.slice(8) };
  if (h === "admin" || h.startsWith("admin-")) return { v: "admin", tab: h.slice(6) || "overview" };
  if (h.startsWith("track-")) return { v: "track", token: h.slice(6) };
  if (h === "track") return { v: "track", token: "" };
  if (h === "auth-action") return { v: "authaction" };
  if (h === "sell" || h === "sell-apply") return { v: "sell", apply: h === "sell-apply" };
  if (h === "seller" || h.startsWith("seller-")) { const [tab, ...rest] = h.slice(7).split("-"); return { v: "seller", tab: tab || "overview", pid: rest.join("-") }; }
  if (h.startsWith("store-")) return { v: "store", handle: h.slice(6) };
  if (h.startsWith("product-")) { const [id, c] = h.slice(8).split("-c"); return { v: "product", id, ci: parseInt(c, 10) || 0 }; }
  if (["about", "contact", "cart", "checkout", "order", "login", "signup", "forgot", "privacy", "terms"].includes(h)) return { v: h };
  if (h === "help" || h.startsWith("help-")) return { v: "help", tab: h.slice(5) };
  if (h === "journal" || h.startsWith("journal-")) return { v: "journal", slug: h.slice(8) };
  if (h === "account" || h.startsWith("account-")) return { v: "account", tab: h.slice(8) || "overview" };
  return { v: "notfound" };
}
function setMeta(title, desc) {
  document.title = title ? `${title} | URBANSTYLE FASHION` : "URBANSTYLE FASHION — Streetwear & Everyday Essentials";
  const m = $('meta[name="description"]'); if (m && desc) m.content = desc;
  const old = $("#ld-json"); if (old) old.remove();
}
function renderView() {
  const view = $("#view");
  document.body.classList.remove("has-sticky", "sticky-desktop"); $("#sticky-atc").hidden = true;
  if (VIEWS._cleanup) { VIEWS._cleanup(); VIEWS._cleanup = null; }
  $$("[data-nav]").forEach(a => { const k = a.dataset.nav; const on = k === route.v || (k === "shop" && route.v === "product"); on ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"); });
  (VIEWS[route.v] || VIEWS.notfound)(view);
  Analytics.page();
}
/* In-page router: every internal link is handled here, so page changes work even
   where the browser or an embedding frame blocks hash navigation. The address bar
   is updated when allowed, which keeps links shareable and Back/Forward working. */
function go(hash, opts = {}) {
  const h = String(hash || "home").replace(/^#/, "") || "home";
  if (opts.fromHistory && h === currentHash) return;
  const prev = route; route = parseRoute(h); currentHash = h;
  if (!opts.fromHistory) { try { history[opts.replace ? "replaceState" : "pushState"]({ h }, "", "#" + h); } catch (e) { /* frame blocks history: stay in-page */ } }
  closePanel(true);
  renderView();
  if (!(prev.v === "shop" && route.v === "shop")) window.scrollTo({ top: 0, behavior: "auto" });
  else { const g = $(".shop-layout"); if (g && window.scrollY > g.offsetTop) window.scrollTo({ top: g.offsetTop - 80 }); }
}

/* ---------- online payments (Paystack) ----------
   1. The Paystack window collects the payment (card, transfer, USSD, bank). Card details go
      straight to Paystack and never touch this site.
   2. /api/verify-payment (a Vercel function holding the secret key) re-prices the bag on the
      server and asks Paystack whether exactly that amount was paid. Only then is the order "paid". */
let paystackState = null; // null | "loading" | "ready" | reason it's unavailable
function paystackAvailability() {
  if (!CFG.paystack.publicKey) return "not-configured";
  if (!/^https?:$/.test(location.protocol)) return "not-hosted";
  return paystackState === "ready" ? "ready" : paystackState || "loading";
}
function loadPaystack() {
  if (paystackState || !CFG.paystack.publicKey || !/^https?:$/.test(location.protocol)) return Promise.resolve();
  paystackState = "loading";
  return withTimeout(loadScript("https://js.paystack.co/v1/inline.js"), 30000)
    .then(() => { paystackState = window.PaystackPop ? "ready" : "blocked"; })
    .catch(() => { paystackState = "blocked"; });
}
// Opens the Paystack window. Resolves with the transaction reference, or null if the customer closes it.
function payWithPaystack({ email, amount, reference, metadata }) {
  return new Promise(resolve => {
    const handler = window.PaystackPop.setup({
      key: CFG.paystack.publicKey, email, amount: Math.round(amount * 100), currency: CFG.currencyCode, ref: reference, metadata,
      callback: function (response) { resolve(response.reference || reference); },
      onClose: function () { resolve(null); }
    });
    handler.openIframe();
  });
}
async function verifyPayment(reference, t, ship) {
  try {
    const res = await withTimeout(fetch(CFG.paystack.verifyEndpoint, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ reference, ship, promo: t.code, lines: t.cart.map(l => ({ id: l.id, size: l.size, qty: l.qty })) })
    }), 30000);
    const j = await res.json().catch(() => ({}));
    if (res.ok && j.ok) return { status: "paid", paidAt: j.paidAt, channel: j.channel };
    if (res.status === 402) return { status: "review", reason: j.error || "not-paid" };
    return { status: "unverified", reason: j.error || "http-" + res.status };
  } catch (e) { return { status: "unverified", reason: "unreachable" }; }
}

      const v = await verifyPayment(paidRef, t, data.ship);
      order.payment = Object.assign({ method: "paystack", reference: paidRef }, v);
      order.pay = v.status === "paid" ? "Paid online" : v.status === "review" ? "Payment under review" : "Paid online (confirming)";
      if (v.status === "review") {
        // Paystack didn't report a successful payment of the right amount: record it for the team, don't confirm.
        await Auth.recordOrder(order);
        b.disabled = false; drawSummary();
        alertBox("pay-alert", `We couldn't confirm this payment (reference <b>${esc(paidRef)}</b>). If you were charged, contact us with that reference and we'll sort it out right away.`);
        return;
      }
    } else { b.disabled = true; b.textContent = "Placing order…"; }
    await postJSON(CFG.orderEndpoint, order);
    await Auth.recordOrder(order);
    if (authMode === "firebase") brandedEmail("order", { number: order.number }); // confirmation email + store alert (runs in the background)
    await Ops.createTracking(order);         // public tracking page (status only, no personal details)
    await Market.createSellerOrders(order); // one order per seller, so each seller only sees their own items
    if (Auth.current()) {
      await Auth.addOrder(order);
      await Auth.update({ phone: data.phone, address: { fullname: data.fullname, phone: data.phone, address: data.address, city: data.city, state: data.state } });
    }
    Analytics.event("purchase", { transaction_id: order.number, value: order.total, currency: CFG.currencyCode });
    store.set("lastOrder", order); store.set("promo", null); setCart([]);
    go("order");
  });
  drawSummary();
};

// shared form wiring: validates on blur, re-validates as you type, shows every error on submit
function bindForm(form, rules, onSubmit) {
  const touched = new Set();
  const check = all => {
    let first = null;
    for (const [k, fn] of Object.entries(rules)) {
      const el = form.elements[k]; if (!el) continue;
      const val = el.type === "checkbox" ? el.checked : el.value;
      const m = fn(val, form), show = all || touched.has(k);
      if (m && !first) first = el;
      const er = $("#au-err-" + k, form); if (er) { er.textContent = show ? m : ""; er.hidden = !(show && m); }
      el.setAttribute("aria-invalid", show && m ? "true" : "false");
    }
    return first;
  };
  form.addEventListener("focusout", e => { if (rules[e.target.name] && (e.target.value || e.target.type === "checkbox")) { touched.add(e.target.name); check(false); } });
  form.addEventListener("input", e => { if (touched.has(e.target.name)) check(false); });
  form.addEventListener("change", e => { if (e.target.type === "checkbox" && rules[e.target.name]) { touched.add(e.target.name); check(false); } });
  form.addEventListener("click", e => {
    const t = e.target.closest(".pw-toggle"); if (!t) return;
    const inp = $("#" + t.dataset.for), show = inp.type === "password";
    inp.type = show ? "text" : "password"; t.setAttribute("aria-pressed", show); t.setAttribute("aria-label", show ? "Hide password" : "Show password"); t.innerHTML = show ? I.eyeOff : I.eye;
  });
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const bad = check(true); if (bad) { bad.focus(); return; }
    const btn = form.querySelector('button[type="submit"]'), label = btn.textContent;
    btn.disabled = true; btn.textContent = btn.dataset.busy || "Please wait…";
    try { await onSubmit(Object.fromEntries(new FormData(form))); }
    finally { if (document.contains(btn)) { btn.disabled = false; btn.textContent = label; } }

const alertBox = (id, msg) => { const a = $("#" + id); if (!a) return; a.innerHTML = msg; a.hidden = !msg; if (msg) a.focus(); };
const authNote = () => `<p class="auth-note">${I.lock}<span>${authMode === "firebase" ? "Secured by Firebase Authentication. URBANSTYLE never sees or stores your password."
  : authMode === "offline" ? "We can't reach the account service right now. Check your internet connection and refresh the page."
  : AUTH_CFG.provider === "firebase" ? "Preview mode: online accounts switch on when the store is opened from its web address. Accounts made here are saved on this device only."
  : "Passwords are stored securely hashed. Accounts are saved on this device."}</span></p>`;
// While Firebase starts up, account pages show a short loading state instead of redirecting.
// Shown while sign-in is still starting up. Whichever page showed it is drawn again as soon as sign-in is
// ready (as long as the visitor is still on that page), so no page can get stuck on this message.
const authLoading = v => {
  v.innerHTML = `<div class="wrap auth-page"><div class="auth-loading" role="status"><span class="spinner" aria-hidden="true"></span>Loading your account…</div></div>`;
  const waitingOn = currentHash;
  authReady.then(() => { if (currentHash === waitingOn && authMode !== "loading") renderView(); });
  return true;
};
function authErrMsg(m, action) {
  if (m.startsWith("locked:")) return `Too many attempts. Wait ${m.split(":")[1]} seconds, then try again.`;
  return ({
    invalid: `That email and password don't match an account. Check them and try again, or <a href="#signup">create an account</a>.`,
    exists: `An account with that email already exists. <a href="#login">Sign in instead</a>.`,
    weak: "Choose a stronger password: at least 8 characters with a letter and a number.",
    network: "We couldn't reach the account service. Check your internet connection and try again.",
    disabled: "Sign-in isn't switched on for this store yet. The store owner needs to enable Email/Password in Firebase Authentication.",
    domain: "This web address isn't approved for sign-in yet. The store owner needs to add it under Firebase Authentication → Settings → Authorized domains.",
    "secure-context": `This browser blocked secure ${action}. Open the site from its web address (https) and try again.`
  })[m] || `We couldn't complete ${action}. Please try again.`;
}

/* Links in our branded emails land here (/?mode=verifyEmail|resetPassword&oobCode=…), so customers

VIEWS.authaction = async v => {
  const act = AUTH_ACTION || {};
  const card = inner => `<div class="wrap auth-page"><section class="auth-card action-card">${inner}</section></div>`;
  const busy = msg => { v.innerHTML = card(`<div class="auth-loading" role="status"><span class="spinner" aria-hidden="true"></span>${msg}</div>`); };
  const done = (title, text, btns) => { v.innerHTML = card(`<div class="action-icon">${I.check}</div><h1 class="auth-h">${title}</h1><p class="auth-sub">${text}</p><div class="btn-pair">${btns}</div>`); };
  const failed = (title, text, btns) => { v.innerHTML = card(`<div class="action-icon is-bad">!</div><h1 class="auth-h">${title}</h1><p class="auth-sub">${text}</p><div class="btn-pair">${btns}</div>`); };
  const expired = e => /expired|invalid-action-code/.test((e && e.code) || "");
  setMeta(act.mode === "resetPassword" ? "Choose a new password" : "Confirm your email");
  if (!act.code) return failed("This link isn't complete", "Open the link straight from the email we sent you, or ask for a new one.", `<a class="btn btn-ink" href="#account">My account</a><a class="btn btn-ghost" href="#home">Back to the shop</a>`);
  busy(act.mode === "resetPassword" ? "Checking your reset link…" : "Confirming your email…");
  await authReady;
  if (authMode !== "firebase") return failed("We can't reach our account service", "Check your internet connection and open the link from the email again.", `<a class="btn btn-ink" href="#home">Back to the shop</a>`);

  if (act.mode === "verifyEmail") {
    try {
      await fb.auth.applyActionCode(act.code);
      AUTH_ACTION.used = true;
      const u = fb.auth.currentUser;
      if (u) { try { await u.reload(); await u.getIdToken(true); } catch (e) {} const me = Auth.current(); if (me) me.verified = true; refreshAccountUI(); }
      done("Your email is confirmed", "Thank you! Your URBANSTYLE account is all set, and we'll send your order updates to this address.",
        u ? `<a class="btn btn-lime" href="#shop">Start shopping ${I.arrow}</a><a class="btn btn-ghost" href="#account">My account</a>` : `<a class="btn btn-lime" href="#login">Sign in ${I.arrow}</a><a class="btn btn-ghost" href="#shop">Browse the shop</a>`);
    } catch (e) {
      const u = fb.auth.currentUser;
      if (u) { try { await u.reload(); } catch (x) {} if (u.emailVerified) return done("Your email is already confirmed", "You're all set. There's nothing else to do.", `<a class="btn btn-lime" href="#shop">Start shopping ${I.arrow}</a><a class="btn btn-ghost" href="#account">My account</a>`); }
      failed(expired(e) ? "This link has expired or was already used" : "We couldn't confirm your email", u ? "No problem. We can send you a fresh link." : "Sign in and we'll send you a fresh link from your account page.",
        u ? `<button type="button" class="btn btn-ink" id="act-resend">Send a new link</button><a class="btn btn-ghost" href="#account">My account</a>` : `<a class="btn btn-ink" href="#login">Sign in</a><a class="btn btn-ghost" href="#home">Back to the shop</a>`);
      const b = $("#act-resend"); if (b) b.addEventListener("click", async () => { b.disabled = true; b.textContent = "Sending…"; try { await Auth.resendVerification(); b.textContent = "Sent! Check your inbox"; } catch (x) { b.disabled = false; b.textContent = "Try again"; } });
    }
    return;
  }

  // resetPassword
  let email;
  try { email = await fb.auth.verifyPasswordResetCode(act.code); }
  catch (e) { return failed(expired(e) ? "This reset link has expired or was already used" : "This reset link doesn't work", "Reset links work once and expire after an hour. Ask for a new one below.", `<a class="btn btn-ink" href="#forgot">Send a new link</a><a class="btn btn-ghost" href="#login">Back to sign in</a>`); }
  v.innerHTML = card(`<h1 class="auth-h">Choose a new password</h1><p class="auth-sub">For <b>${esc(email)}</b></p>
    <form class="auth-form" id="reset-form" novalidate>
      ${afield("newpw", "New password", "password", 'autocomplete="new-password" minlength="8"')}
      ${afield("confirm", "Confirm new password", "password", 'autocomplete="new-password"')}
      <p class="muted small">At least 8 characters, with a letter and a number.</p>
      <button class="btn btn-ink btn-block" type="submit" data-busy="Saving…">Save new password</button></form>`);
  bindForm($("#reset-form"), {
    newpw: x => { const c = pwChecks(x); return c.len && c.letter && c.num ? "" : "Use at least 8 characters with a letter and a number."; },
    confirm: (x, f) => x && x === f.elements.newpw.value ? "" : "The two passwords don't match."
  }, async d => {
    try {
      await fb.auth.confirmPasswordReset(act.code, d.newpw);
      AUTH_ACTION.used = true;
      authNext = "account";
      done("Your password has been changed", "You can now sign in with your new password.", `<a class="btn btn-lime" href="#login">Sign in ${I.arrow}</a><a class="btn btn-ghost" href="#shop">Browse the shop</a>`);
    } catch (e) {
      const a = document.createElement("div"); a.className = "form-alert"; a.setAttribute("role", "alert");
      a.innerHTML = expired(e) ? "This reset link has expired. <a href=\"#forgot\">Send a new one</a>." : e && e.code === "auth/weak-password" ? "Please choose a stronger password." : "We couldn't save your new password. Please try again.";
      $("#reset-form").prepend(a);
    }
  });
};

/* photos: resize + compress in the browser */
function toImage(src) {
  return new Promise((res, rej) => {
    const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error("bad-image"));
    im.src = typeof src === "string" ? src : URL.createObjectURL(src);
  });
}
async function compressImage(src, maxSide, maxChars) {
  const im = await toImage(src);
  const s = Math.min(1, maxSide / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(im.naturalWidth * s)); c.height = Math.max(1, Math.round(im.naturalHeight * s));
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(im, 0, 0, c.width, c.height);
  let q = .85, out = c.toDataURL("image/jpeg", q);
  while (out.length > maxChars && q > .35) { q -= .08; out = c.toDataURL("image/jpeg", q); }
  if (out.length > maxChars) { c.width = Math.round(c.width * .7); c.height = Math.round(c.height * .7); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); out = c.toDataURL("image/jpeg", .6); }
  return out;
}

const LocalMarket = {
